<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>台南騎車生存記</title>
  <meta name="description" content="從台南火車站騎腳踏車去成大上課！閃過逆向、亂切、闖紅燈的機車和人行道坑洞，平安又準時地抵達教室。">
  <meta name="theme-color" content="#0d1218">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
  <!-- 分享到社群網站時顯示的標題、說明、縮圖 -->
  <meta property="og:title" content="台南騎車生存記">
  <meta property="og:description" content="從台南火車站騎腳踏車去成大上課，閃過台南的機車和坑洞，平安又準時地抵達！">
  <meta property="og:image" content="https://tainanbike.vercel.app/thumbnail.png">
  <meta property="og:url" content="https://tainanbike.vercel.app/">
  <meta property="og:type" content="website">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      background: radial-gradient(ellipse at top, #24323f 0%, #0d1218 70%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      height: 100vh;
      height: 100dvh;        /* 手機瀏覽器網址列會伸縮，用 dvh 比較準 */
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      background: #000;
      touch-action: none;    /* 在畫面上點擊時，不要讓網頁捲動或縮放 */
    }

    /* ===== 手機觸控按鈕（電腦上不顯示）===== */
    #touch {
      display: none;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #touch .pad {
      display: flex;
      gap: 10px;
    }
    #touch .pad.vertical {
      flex-direction: column;
      gap: 8px;
    }
    #touch button {
      touch-action: none;
      width: 70px;
      height: 62px;
      border: 2px solid #78909c;
      border-radius: 14px;
      background: #2f3d47;
      color: #fff;
      font: bold 24px sans-serif;
    }
    #touch .pad.vertical button {
      width: 86px;
      height: 52px;
      font-size: 17px;
    }
    #touch .pad.middle button {
      width: 66px;
      font-size: 15px;
    }
    #touch button.down {
      background: #2e7d32;      /* 按住時變綠色 */
      border-color: #69f0ae;
    }
    @media (pointer: coarse) {
      #touch {
        display: flex;
      }
    }

    /* ===== 輸入名字的對話框（用 HTML 做，才能打中文）===== */
    #nameDialog {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5, 10, 16, 0.72);
      z-index: 10;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    #nameDialog.show {
      display: flex;
    }
    .dialog-card {
      width: min(88vw, 360px);
      background: linear-gradient(#1f2e3d, #141d27);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 22px 20px;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .dialog-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .dialog-text {
      font-size: 14px;
      color: #b0bec5;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    #nameInput {
      width: 100%;
      box-sizing: border-box;
      font-size: 18px;          /* 16 以上，iPhone 才不會自動放大畫面 */
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #607d8b;
      background: #0d1520;
      color: #fff;
      outline: none;
      text-align: center;
    }
    #nameInput:focus {
      border-color: #69f0ae;
    }
    .dialog-error {
      min-height: 20px;
      font-size: 13px;
      color: #ff8a80;
      margin: 8px 0;
    }
    .dialog-buttons {
      display: flex;
      gap: 10px;
    }
    .dialog-buttons button {
      flex: 1;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      border-radius: 10px;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    #nameOk {
      background: #2e7d32;
    }
    #nameOk:disabled {
      opacity: 0.6;
    }
    #nameCancel {
      background: #455a64;
      display: none;
    }
    #nameCancel.show {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 手機觸控按鈕：data-key 對應鍵盤上的按鍵 -->
  <div id="touch">
    <div class="pad">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowRight">▶</button>
    </div>
    <div class="pad vertical middle">
      <button data-key="b">🔔</button>
      <button data-key=" ">確認</button>
    </div>
    <div class="pad vertical">
      <button data-key="ArrowUp">▲ 加速</button>
      <button data-key="ArrowDown">▼ 煞車</button>
    </div>
  </div>

  <!-- 輸入名字（排行榜用）-->
  <div id="nameDialog">
    <div class="dialog-card">
      <div class="dialog-title" id="nameTitle">🚲 歡迎來到台南騎車生存記</div>
      <div class="dialog-text">請輸入你的名字<br>排行榜會用這個名字，一個名字只能一個人用</div>
      <input id="nameInput" maxlength="12" placeholder="例如：Eason" autocomplete="off">
      <div class="dialog-error" id="nameError"></div>
      <div class="dialog-buttons">
        <button id="nameCancel">取消</button>
        <button id="nameOk">確定</button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================================
    //  台南騎車生存記 v2
    //  - 畫面用「邏輯座標」500 × 600 來畫，再依螢幕解析度放大，所以永遠清晰
    //  - 遊戲邏輯固定每秒更新 60 次，在 120Hz / 144Hz 螢幕上速度也一樣
    // =====================================================================

    // ===== 畫布與畫質 =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = 500;          // 遊戲世界的寬（邏輯座標，跟螢幕大小無關）
    const H = 600;          // 遊戲世界的高
    let renderScale = 1;    // 邏輯座標 → 實際像素的倍率

    // 依照視窗大小決定畫布顯示多大，並用螢幕的真實解析度來畫（高解析螢幕不會糊）
    function resizeCanvas() {
      const touch = isTouch();
      const bar = document.getElementById("touch");
      const availW = window.innerWidth - 16;
      const availH = window.innerHeight - 16 - (touch ? 140 : 0);
      const scale = Math.max(0.3, Math.min(availW / W, availH / H));
      const cssW = Math.floor(W * scale);
      const cssH = Math.floor(H * scale);
      canvas.style.width = cssW + "px";
      canvas.style.height = cssH + "px";
      bar.style.width = Math.max(cssW, 310) + "px";
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      renderScale = canvas.width / W;
    }

    // 是不是觸控裝置（手機、平板）
    function isTouch() {
      return window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    }

    // ===== 小工具 =====
    const FONT_FAMILY = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
    function font(size, weight) {
      return (weight || "normal") + " " + size + "px " + FONT_FAMILY;
    }

    // 產生 min ~ max 之間的隨機整數
    function randomBetween(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }
    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    // 圓角矩形的路徑（畫之前呼叫，之後再 fill 或 stroke）
    function rr(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function circle(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    function ellipse(x, y, rx, ry, rot) {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
      ctx.fill();
    }
    function line(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // 把 #rrggbb 顏色變亮（正數）或變暗（負數）
    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const r = clamp((n >> 16) + amt, 0, 255);
      const g = clamp(((n >> 8) & 255) + amt, 0, 255);
      const b = clamp((n & 255) + amt, 0, 255);
      return "rgb(" + r + "," + g + "," + b + ")";
    }

    // 固定種子的亂數：每次產生的花紋都一樣
    function seededRandom(seed) {
      return function () {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ===== 瀏覽器儲存（存不了也沒關係，會記在變數裡）=====
    const memoryStore = {};
    function storeGet(key) {
      try {
        const v = localStorage.getItem(key);
        if (v !== null) return v;
      } catch (e) {}
      return key in memoryStore ? memoryStore[key] : null;
    }
    function storeSet(key, value) {
      memoryStore[key] = value;
      try {
        localStorage.setItem(key, value);
      } catch (e) {}
    }

    // ===== 音效：全部用程式「合成」出來，不需要任何音檔 =====
    const Sound = {
      ctx: null,
      master: null,
      musicBus: null,
      noiseBuffer: null,
      muted: false,

      // 瀏覽器規定：要等玩家按鍵或點擊後才能發出聲音
      unlock() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.connect(this.ctx.destination);
          this.musicBus = this.ctx.createGain();
          this.musicBus.gain.value = 0.55;
          this.musicBus.connect(this.master);
          // 一秒鐘的白噪音，用來做撞擊、煞車、腳步聲
          const len = this.ctx.sampleRate;
          this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const data = this.noiseBuffer.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
          this.applyMute();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      applyMute() {
        if (this.master) this.master.gain.value = this.muted ? 0 : 0.8;
      },

      // 在時間 t 播一個音：頻率、長度、波形、音量、（可選）滑到另一個頻率
      toneAt(freq, t, dur, type, vol, slideTo, dest) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g);
        g.connect(dest);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      },
      tone(freq, dur, type, vol, delay, slideTo) {
        if (!this.ctx || this.muted) return;
        this.toneAt(freq, this.ctx.currentTime + (delay || 0), dur, type, vol, slideTo, this.master);
      },

      // 濾波後的噪音：可以做出「碰」、「嘶」、「咻」各種聲音
      noiseAt(t, dur, vol, freq, q, filterType, slideTo, dest) {
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const f = this.ctx.createBiquadFilter();
        f.type = filterType || "bandpass";
        f.frequency.setValueAtTime(freq || 1000, t);
        if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        f.Q.value = q || 1;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f);
        f.connect(g);
        g.connect(dest);
        src.start(t);
        src.stop(t + dur + 0.05);
      },
      noise(dur, vol, freq, delay, q, filterType, slideTo) {
        if (!this.ctx || this.muted) return;
        this.noiseAt(this.ctx.currentTime + (delay || 0), dur, vol, freq, q, filterType, slideTo, this.master);
      },

      // ----- 各種音效 -----
      bell()      { this.tone(2350, 0.7, "sine", 0.16); this.tone(3520, 0.5, "sine", 0.05);
                    this.tone(2350, 0.7, "sine", 0.14, 0.16); this.tone(3520, 0.5, "sine", 0.04, 0.16); },
      horn()      { for (const d of [0, 0.28]) { this.tone(415, 0.22, "square", 0.05, d); this.tone(523, 0.22, "square", 0.04, d); } },
      hornShort() { this.tone(440, 0.18, "square", 0.05); this.tone(554, 0.18, "square", 0.04); },
      crash()     { this.noise(0.5, 0.6, 900, 0, 0.6, "lowpass"); this.tone(110, 0.35, "sine", 0.4, 0, 40);
                    this.noise(0.2, 0.25, 3500, 0.02, 2); },
      thud()      { this.tone(140, 0.18, "sine", 0.35, 0, 55); this.noise(0.1, 0.25, 500, 0, 1, "lowpass"); },
      screech()   { this.noise(0.5, 0.12, 2600, 0, 8, "bandpass", 1800); this.tone(1900, 0.45, "sawtooth", 0.012, 0, 1600); },
      whoosh()    { this.noise(0.35, 0.3, 500, 0, 1.5, "bandpass", 2500); },
      coin()      { this.tone(988, 0.09, "square", 0.06); this.tone(1319, 0.3, "square", 0.06, 0.08); },
      click()     { this.tone(880, 0.04, "square", 0.035); },
      confirm()   { this.tone(660, 0.08, "square", 0.05); this.tone(990, 0.16, "square", 0.05, 0.07); },
      alarm()     { for (let k = 0; k < 4; k++) this.tone(1760, 0.05, "square", 0.05, k * 0.08); },
      gasp()      { this.tone(330, 0.28, "triangle", 0.18, 0, 880); },
      sting()     { for (const f of [147, 175, 208]) this.tone(f, 0.7, "sawtooth", 0.035); this.tone(73, 0.7, "triangle", 0.2); },
      step()      { this.noise(0.05, 0.18, 1200, 0, 1.2); },
      jump()      { this.tone(260, 0.2, "sine", 0.18, 0, 780); },
      beep()      { this.tone(1250, 0.07, "square", 0.03); },
      fanfare()   { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i === 3 ? 0.6 : 0.14, "square", 0.06, i * 0.12));
                    this.tone(1319, 0.6, "square", 0.03, 0.36); },
      fail()      { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.25, "triangle", 0.18, i * 0.18)); },
      siren()     { for (let k = 0; k < 6; k++) this.tone(k % 2 ? 740 : 990, 0.38, "sine", 0.12, k * 0.4); }
    };

    // ===== 背景音樂：簡單的循環小曲（C - Am - F - G）=====
    const Music = {
      playing: false,
      step: 0,
      nextTime: 0,
      timer: null,
      BPM: 108,
      BASS: [48, 45, 41, 43],
      MELODY: [
        [72, 0, 76, 0, 79, 0, 76, 0, 74, 0, 72, 0, 74, 76, 0, 0],
        [72, 0, 69, 0, 72, 0, 76, 0, 74, 0, 72, 0, 69, 0, 0, 0],
        [69, 0, 72, 0, 77, 0, 76, 0, 74, 0, 72, 0, 74, 0, 76, 0],
        [79, 0, 76, 0, 74, 0, 72, 0, 74, 0, 0, 0, 67, 0, 0, 0]
      ],
      start() {
        if (!Sound.ctx || this.playing) return;
        this.playing = true;
        this.step = 0;
        this.nextTime = Sound.ctx.currentTime + 0.12;
        this.timer = setInterval(() => this.schedule(), 40);
      },
      stop() {
        this.playing = false;
        if (this.timer) clearInterval(this.timer);
        this.timer = null;
      },
      // 提前一點點把接下來的音符排進時間表，節奏才會穩
      schedule() {
        if (!Sound.ctx) return;
        const stepDur = 60 / this.BPM / 4;
        while (this.nextTime < Sound.ctx.currentTime + 0.15) {
          if (!Sound.muted) this.playStep(this.step, this.nextTime, stepDur);
          this.nextTime += stepDur;
          this.step = (this.step + 1) % 64;
        }
      },
      playStep(s, t, d) {
        const bar = Math.floor(s / 16);
        const i = s % 16;
        const bus = Sound.musicBus;
        const midi = n => 440 * Math.pow(2, (n - 69) / 12);
        // 低音
        if (i === 0 || i === 6 || i === 8 || i === 14) {
          Sound.toneAt(midi(this.BASS[bar] + (i === 8 ? 12 : 0)), t, d * 1.8, "triangle", 0.13, null, bus);
        }
        // 旋律
        const m = this.MELODY[bar][i];
        if (m) Sound.toneAt(midi(m), t, d * 1.6, "square", 0.028, null, bus);
        // 和弦墊底
        if (i === 0) {
          const root = this.BASS[bar] + 24;
          for (const iv of [0, bar === 1 ? 3 : 4, 7]) Sound.toneAt(midi(root + iv), t, d * 15, "sine", 0.018, null, bus);
        }
        // 輕輕的鼓
        if (i % 4 === 2) Sound.noiseAt(t, 0.04, 0.035, 8000, 0.7, "highpass", null, bus);
        if (i % 8 === 0) Sound.toneAt(110, t, 0.12, "sine", 0.12, 50, bus);
      }
    };

    // ===== 預先畫好的地面花紋（柏油、紅磚、屋頂），重複鋪滿 =====
    const patterns = {};

    // 先在一張小畫布上畫好花紋（用 2 倍解析度畫，比較清楚），再變成可以重複的圖樣
    function makePattern(w, h, drawFn) {
      const c = document.createElement("canvas");
      c.width = w * 2;
      c.height = h * 2;
      const g = c.getContext("2d");
      g.scale(2, 2);
      drawFn(g, w, h);
      const p = ctx.createPattern(c, "repeat");
      try {
        if (p.setTransform && window.DOMMatrix) p.setTransform(new DOMMatrix([0.5, 0, 0, 0.5, 0, 0]));
      } catch (e) {}
      return p;
    }

    function initPatterns() {
      // 柏油：深灰底 + 細小的碎石顆粒 + 補丁 + 裂縫
      patterns.asphalt = makePattern(128, 128, (g, w, h) => {
        const rnd = seededRandom(7);
        g.fillStyle = "#4a4d53";
        g.fillRect(0, 0, w, h);
        for (let i = 0; i < 900; i++) {
          g.fillStyle = rnd() < 0.5 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.09)";
          g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
        }
        for (let i = 0; i < 3; i++) {
          g.fillStyle = "rgba(0,0,0,0.06)";
          g.beginPath();
          g.ellipse(20 + rnd() * 88, 20 + rnd() * 88, 8 + rnd() * 16, 5 + rnd() * 8, rnd() * 3, 0, Math.PI * 2);
          g.fill();
        }
        g.strokeStyle = "rgba(0,0,0,0.2)";
        g.lineWidth = 0.8;
        for (let i = 0; i < 2; i++) {
          let x = 20 + rnd() * 88;
          let y = 10 + rnd() * 50;
          g.beginPath();
          g.moveTo(x, y);
          for (let k = 0; k < 5; k++) {
            x += (rnd() - 0.5) * 16;
            y += rnd() * 12;
            g.lineTo(x, y);
          }
          g.stroke();
        }
      });

      // 紅磚人行道（台南很常見的紅磚道）
      patterns.brick = makePattern(40, 24, (g, w, h) => {
        const rnd = seededRandom(3);
        const cols = ["#b0614a", "#a65a44", "#ba6b52", "#9e523d", "#b86650"];
        g.fillStyle = "#7d4433";
        g.fillRect(0, 0, w, h);
        const brick = (x, y, bw) => {
          g.fillStyle = cols[Math.floor(rnd() * cols.length)];
          g.fillRect(x + 1, y + 1, bw - 2, 10);
          g.fillStyle = "rgba(255,255,255,0.07)";
          g.fillRect(x + 1, y + 1, bw - 2, 2);
        };
        brick(0, 0, 20);
        brick(20, 0, 20);
        brick(-10, 12, 20);
        brick(10, 12, 20);
        brick(30, 12, 20);
      });

      // 從空中看的透天厝屋頂：水塔、冷氣室外機、盆栽
      patterns.roof = makePattern(160, 160, (g, w, h) => {
        const rnd = seededRandom(11);
        const roofs = ["#a8a29e", "#bdb6ac", "#9ca3af", "#c9b79c", "#8fa39a", "#b6a597", "#d6d3d1", "#a1887f", "#90a4ae"];
        g.fillStyle = "#57534e";   // 巷弄
        g.fillRect(0, 0, w, h);
        let y = 0;
        while (y < h) {
          const bh = Math.min(h - y, 32 + Math.floor(rnd() * 30));
          let x = 0;
          while (x < w) {
            const bw = Math.min(w - x, 30 + Math.floor(rnd() * 34));
            g.fillStyle = roofs[Math.floor(rnd() * roofs.length)];
            g.fillRect(x + 1.5, y + 1.5, bw - 3, bh - 3);
            g.strokeStyle = "rgba(255,255,255,0.18)";   // 女兒牆
            g.lineWidth = 1;
            g.strokeRect(x + 3, y + 3, bw - 6, bh - 6);
            if (bw > 18 && bh > 18 && rnd() < 0.45) {   // 不鏽鋼水塔
              const tx = x + 8 + rnd() * (bw - 16);
              const ty = y + 8 + rnd() * (bh - 16);
              g.fillStyle = "#e5e7eb";
              g.beginPath(); g.arc(tx, ty, 5, 0, Math.PI * 2); g.fill();
              g.strokeStyle = "#9ca3af";
              g.beginPath(); g.arc(tx, ty, 5, 0, Math.PI * 2); g.stroke();
              g.fillStyle = "#cbd5e1";
              g.beginPath(); g.arc(tx - 1, ty - 1, 2, 0, Math.PI * 2); g.fill();
            }
            if (bw > 16 && bh > 14 && rnd() < 0.4) {    // 冷氣室外機
              g.fillStyle = "#f1f5f9";
              g.fillRect(x + 5 + rnd() * (bw - 14), y + 5 + rnd() * (bh - 12), 8, 6);
            }
            if (bw > 14 && bh > 14 && rnd() < 0.3) {    // 盆栽
              g.fillStyle = "#4d7c4f";
              for (let k = 0; k < 3; k++) {
                g.beginPath();
                g.arc(x + 6 + rnd() * (bw - 12), y + 6 + rnd() * (bh - 12), 2.5, 0, Math.PI * 2);
                g.fill();
              }
            }
            x += bw;
          }
          y += bh;
        }
      });
    }

    // 用花紋鋪滿一塊區域，而且花紋會跟著地面一起往下捲動
    function fillScrolling(pattern, period, x, y, w, h) {
      const off = groundScroll % period;
      ctx.save();
      ctx.translate(0, off);
      ctx.fillStyle = pattern;
      ctx.fillRect(x, y - off, w, h);
      ctx.restore();
    }

    // ===== 版面配置（邏輯座標寬 500）=====
    //  0     60     100      200      300      400    440    500
    //  | 建築 |人行道|  車道0  |  車道1  |  車道2  |人行道| 建築 |
    const lanes = [150, 250, 350];   // 三條車道的中心 x

    // 車道編號 → x 座標（-1 = 左邊人行道、3 = 右邊人行道）
    function laneX(lane) {
      if (lane === -1) return 80;
      if (lane === 3) return 420;
      return lanes[lane];
    }

    // ===== 第 1 步：道路 =====
    let roadOffset = 0;    // 車道虛線往下移了多少（0 ~ 50）
    let groundScroll = 0;  // 地面花紋往下移了多少（給柏油、紅磚、屋頂用）
    let speed = 3;         // 目前車速：每一幀移動幾像素（會因踩踏、煞車、滑行而改變）
    let frameCount = 0;    // 從打開網頁到現在經過幾幀（動畫用）

    // 車速的物理設定（調這些數字就能改變手感）
    const MAX_SPEED = 10;      // 最高速
    const MIN_SPEED = 0;       // 最低速：可以完全停下來（等紅燈）
    const CRUISE_SPEED = 3;    // 不踩也不煞時，會慢慢回到這個速度
    const PEDAL_POWER = 0.03;  // 踩踏板的力道（腳踏車加速很慢，越小越慢）
    const BRAKE_POWER = 0.1;   // 煞車的力道
    const SAFE_SPEED = 2;      // 低於這個速度（8 km/h），機車會看到你、繞過你，不會撞你

    // 地面往下捲動（騎了多遠）
    function scrollGround(amount) {
      roadOffset = (roadOffset + amount) % 50;
      groundScroll = (groundScroll + amount) % 1920;   // 1920 剛好是所有花紋週期的公倍數
    }

    function drawRoad() {
      // 屋頂（畫得比畫布大很多，轉彎旋轉畫面時才不會露出空白）
      fillScrolling(patterns.roof, 160, -1000, -1000, 2500, 2600);

      // 紅磚人行道
      fillScrolling(patterns.brick, 24, 60, -1000, 40, 2600);
      fillScrolling(patterns.brick, 24, 400, -1000, 40, 2600);

      // 柏油路（中間 300 寬，分成 3 條車道，每條 100）
      fillScrolling(patterns.asphalt, 128, 100, -1000, 300, 2600);

      // 路緣石
      ctx.fillStyle = "#c9c9c9";
      ctx.fillRect(97, -1000, 3, 2600);
      ctx.fillRect(400, -1000, 3, 2600);

      // 路邊的白色實線
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.fillRect(106, -1000, 3, 2600);
      ctx.fillRect(391, -1000, 3, 2600);

      // 白色虛線車道線
      ctx.strokeStyle = "rgba(255,255,255,0.92)";
      ctx.lineWidth = 4;
      ctx.setLineDash([30, 20]);        // 畫 30、空 20
      ctx.lineDashOffset = -roadOffset; // 虛線往下移
      ctx.beginPath();
      ctx.moveTo(200, -1000);
      ctx.lineTo(200, 1600);
      ctx.moveTo(300, -1000);
      ctx.lineTo(300, 1600);
      ctx.stroke();
      ctx.setLineDash([]);              // 用完要關掉，不然後面畫的線都會變虛線
    }

    // ===== 第 2 步：腳踏車 =====

    // 腳踏車的資料
    const player = {
      lane: 1,   // 「目標」車道：-1 ~ 3
      x: 250,    // 目前「實際」的 x 座標（會慢慢滑向目標車道）
      vx: 0,     // 橫向速度（往右為正、往左為負）
      y: 520,    // 垂直位置（靠近畫面下方）
      tilt: 0    // 車身傾斜角度
    };

    // 轉彎的物理設定
    const STEER_FORCE = 0.02;    // 轉向的力道：越大轉越快
    const STEER_DAMPING = 0.8;   // 阻尼：每一幀橫向速度只保留 80%，避免一直左右甩

    let wobbleTime = 0;   // 低速搖晃用的計時
    let pedalPhase = 0;   // 踩踏板動畫的角度

    // 更新車速：踩踏、煞車、滑行
    function updateSpeed() {
      if (keys["ArrowUp"]) {
        // 踩踏板：越快越難再加速（風阻越大）
        speed = speed + PEDAL_POWER * (1 - speed / MAX_SPEED);
      } else if (keys["ArrowDown"]) {
        // 煞車
        speed = speed - BRAKE_POWER;
      } else {
        // 不踩也不煞：每一幀往巡航速度靠近 1%
        speed = speed + (CRUISE_SPEED - speed) * 0.01;
      }

      // 限制在最低速和最高速之間
      speed = clamp(speed, MIN_SPEED, MAX_SPEED);
      pedalPhase = pedalPhase + speed * 0.13;
    }

    // 更新腳踏車：用「力 → 速度 → 位置」的方式滑向目標車道
    function updatePlayer() {
      updateSpeed();

      const targetX = laneX(player.lane);   // 想去的位置（-1、3 是人行道）
      const distance = targetX - player.x;  // 還差多遠（正 = 在右邊，負 = 在左邊）

      // 離目標越遠，轉向的力越大 → 改變橫向速度
      player.vx = player.vx + distance * STEER_FORCE;
      // 阻尼：速度會慢慢被吃掉，不然會像彈簧一樣甩個不停
      player.vx = player.vx * STEER_DAMPING;
      // 橫向速度 → 改變位置
      player.x = player.x + player.vx;

      // 橫向甩得越快，車身傾斜越多
      player.tilt = player.vx * 0.06;

      // 低速時騎不穩，車身會左右搖晃（完全停下來時腳踩地，就不晃了）
      wobbleTime = wobbleTime + 0.15;
      if (speed > 0.2 && speed < 1.5) {
        player.tilt = player.tilt + Math.sin(wobbleTime) * 0.08 * (1.5 - speed);
      }
    }

    // 從正上方看的腳踏車和騎士（車頭朝上）
    function drawBikeSprite(pedal, footDown) {
      // 影子
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ellipse(4, 6, 14, 31);

      // 輪胎
      ctx.fillStyle = "#1c1c1c";
      rr(-2.5, -33, 5, 18, 2.5); ctx.fill();
      rr(-2.5, 14, 5, 18, 2.5); ctx.fill();

      // 車架
      ctx.strokeStyle = "#e53935";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      line(0, -18, 0, 16);

      // 前面的菜籃（台灣學生車的標配）
      ctx.fillStyle = "rgba(207,216,220,0.3)";
      rr(-8, -38, 16, 9, 2); ctx.fill();
      ctx.strokeStyle = "#cfd8dc";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 腳（踩踏板時左右交替）
      const k = Math.sin(pedal) * 5;
      ctx.fillStyle = "#283593";
      ellipse(-7, -2 + k, 3.6, 8.5);
      ellipse(7, -2 - k, 3.6, 8.5);
      ctx.fillStyle = "#eceff1";
      circle(-7, -9 + k, 2.6);
      circle(7, -9 - k, 2.6);
      if (footDown) {
        // 停下來時，一隻腳踩在地上
        ctx.fillStyle = "#283593";
        ellipse(-15, 4, 3.6, 8, -0.5);
        ctx.fillStyle = "#eceff1";
        circle(-18, 10, 2.8);
      }

      // 把手
      ctx.strokeStyle = "#37474f";
      ctx.lineWidth = 3;
      line(-13, -21, 13, -21);

      // 身體（橘色帽 T）
      ctx.fillStyle = "#ff7043";
      rr(-13, -7, 26, 17, 8); ctx.fill();

      // 手臂和手
      ctx.strokeStyle = "#ff7043";
      ctx.lineWidth = 5;
      line(-11, -4, -12, -19);
      line(11, -4, 12, -19);
      ctx.fillStyle = "#f1c27d";
      circle(-12, -20, 2.6);
      circle(12, -20, 2.6);

      // 書包
      ctx.fillStyle = "#1a237e";
      rr(-9, 7, 18, 12, 4); ctx.fill();
      ctx.fillStyle = "#3949ab";
      rr(-7, 9, 14, 4, 2); ctx.fill();

      // 頭（從上面看是頭髮）
      ctx.fillStyle = "#3e2723";
      circle(0, -8, 7.5);
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      circle(-2.5, -10, 3);
    }

    // 畫出腳踏車
    function drawPlayer() {
      // 無敵時間內閃爍：每 5 幀切換一次「畫 / 不畫」
      if (invincibleTimer > 0 && Math.floor(invincibleTimer / 5) % 2 === 0) {
        return;
      }

      // 轉彎中：車頭方向跟著轉
      let heading = 0;
      if (turning) {
        heading = turning.dir * turning.phi;
      }

      ctx.save();                              // 記住目前的畫布狀態
      ctx.translate(player.x, player.y);       // 把原點移到腳踏車的位置
      ctx.rotate(heading + player.tilt);       // 車頭方向 + 車身傾斜
      drawBikeSprite(pedalPhase, speed < 0.05 && !turning);
      ctx.restore();                           // 恢復原本的畫布狀態，不影響其他東西

      // 準備轉彎時，頭上顯示黃色箭頭
      if (turnQueued !== 0) {
        const bob = Math.sin(frameCount * 0.2) * 3;
        drawTurnArrow(player.x, player.y - 58 + bob, turnQueued, "#ffd740", 0.7);
      }
    }

    // 路面上的轉彎箭頭（dir：1 = 右轉、-1 = 左轉）
    function drawTurnArrow(x, y, dir, color, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir * (scale || 1), scale || 1);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-5, 34);
      ctx.lineTo(-5, -4);
      ctx.quadraticCurveTo(-5, -18, 9, -18);
      ctx.lineTo(9, -27);
      ctx.lineTo(25, -13);
      ctx.lineTo(9, 1);
      ctx.lineTo(9, -8);
      ctx.quadraticCurveTo(5, -8, 5, -4);
      ctx.lineTo(5, 34);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // ===== 第 4.5 步：街景（店家招牌、行道樹）=====

    const SHOP_NAMES = ["牛肉湯", "鍋燒意麵", "鹹粥", "豆花", "早餐店", "飲料", "文具", "機車行", "藥局",
                        "便當", "肉圓", "碗粿", "蝦捲", "冰店", "書局", "麵包", "蚵仔煎", "米糕", "擔仔麵", "咖啡"];
    const LANDMARKS = [
      { icon: "🏫", name: "成功大學" },
      { icon: "🏯", name: "赤崁樓" },
      { icon: "🏬", name: "林百貨" },
      { icon: "🛕", name: "孔廟" },
      { icon: "🏰", name: "安平古堡" }
    ];
    const SIGN_STYLES = [
      { bg: "#c62828", fg: "#ffeb3b" },
      { bg: "#fafafa", fg: "#c62828" },
      { bg: "#1565c0", fg: "#ffffff" },
      { bg: "#ffd600", fg: "#212121" },
      { bg: "#2e7d32", fg: "#ffffff" },
      { bg: "#212121", fg: "#ffca28" }
    ];
    const AWNING_COLORS = ["#e53935", "#1e88e5", "#43a047", "#fb8c00", "#8e24aa", "#00897b", "#f4511e", "#6d4c41"];

    let scenery = [];   // 畫面上的店家（shop）和行道樹（tree）

    // 某一邊（-1 左、1 右）某一種街景，最上面那一個的 y
    function sideTop(side, kind) {
      let top = Infinity;
      for (const s of scenery) {
        if (s.kind === kind && s.side === side) top = Math.min(top, s.y);
      }
      return top;
    }

    // 把街景補滿到 limitTop（畫面上方外面一點），路口範圍內不放
    function fillScenery(limitTop, fadeIn) {
      const I = intersection;
      for (const side of [-1, 1]) {
        // 店家：從最上面那間繼續往上蓋
        let top = sideTop(side, "shop");
        if (top === Infinity) top = 700;
        let guard = 0;
        while (top > limitTop && guard++ < 60) {
          const isLandmark = Math.random() < 0.12;
          const lm = isLandmark ? pick(LANDMARKS) : null;
          const name = lm ? lm.name : pick(SHOP_NAMES);
          const needed = Array.from(name).length * 15 + 26 + (lm ? 18 : 0);
          const h = Math.max(randomBetween(80, 130), needed);
          const bottom = top - randomBetween(0, 6);
          if (I && bottom > I.y - 205 && bottom - h < I.y + 205) {
            top = Math.min(top, I.y - 205);   // 跳過路口
            if (bottom <= I.y - 205) break;
            continue;
          }
          scenery.push({
            kind: "shop", side: side, y: bottom - h, h: h,
            awning: pick(AWNING_COLORS), sign: pick(SIGN_STYLES),
            name: name, icon: lm ? lm.icon : null,
            fade: fadeIn ? 0 : 1
          });
          top = bottom - h;
        }

        // 行道樹：每隔一段種一棵
        let treeY = sideTop(side, "tree");
        if (treeY === Infinity) treeY = 700 - randomBetween(0, 150);
        guard = 0;
        while (treeY > limitTop && guard++ < 30) {
          const y = treeY - randomBetween(150, 280);
          const r = randomBetween(22, 30);
          treeY = y;
          if (I && Math.abs(y - I.y) < 205 + r) continue;
          scenery.push({
            kind: "tree", side: side, y: y, r: r,
            x: (side < 0 ? 56 : 444) + randomBetween(-4, 4),
            seed: Math.random() * 10,
            fade: fadeIn ? 0 : 1
          });
        }
      }
    }

    // 新路口出現時，把會蓋到路口的街景拿掉（那時路口還在畫面外，看不到）
    function clearSceneryInBand(I) {
      scenery = scenery.filter(s => {
        const top = s.kind === "shop" ? s.y : s.y - s.r;
        const bottom = s.kind === "shop" ? s.y + s.h : s.y + s.r;
        return bottom < I.y - 205 || top > I.y + 205;
      });
    }

    // 更新街景：往下移、刪掉離開畫面的、補上新的
    function updateScenery(scroll) {
      for (const s of scenery) {
        s.y = s.y + scroll;
        if (s.fade < 1) s.fade = Math.min(1, s.fade + 0.04);
      }
      scenery = scenery.filter(s => s.y < 700);
      fillScenery(-160, false);
    }

    // 店家：騎樓的遮雨棚 + 直式招牌
    function drawShop(s) {
      const left = s.side < 0;
      ctx.globalAlpha = s.fade;

      // 店與店之間的分界
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(left ? 0 : 440, s.y, 60, 2);

      // 遮雨棚（靠人行道那一側），有條紋
      const ax = left ? 47 : 440;
      ctx.fillStyle = s.awning;
      ctx.fillRect(ax, s.y + 4, 13, s.h - 8);
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      for (let y = s.y + 8; y < s.y + s.h - 8; y += 12) {
        ctx.fillRect(ax, y, 13, 5);
      }
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(left ? 58 : 440, s.y + 4, 2, s.h - 8);

      // 直式招牌
      const chars = Array.from(s.name);
      const bx = left ? 12 : 464;
      const bh = chars.length * 15 + 12 + (s.icon ? 18 : 0);
      rr(bx, s.y + 7, 24, bh, 4);
      ctx.fillStyle = s.sign.bg;
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let cy = s.y + 7 + 13;
      if (s.icon) {
        ctx.font = font(14);
        ctx.fillText(s.icon, bx + 12, cy);
        cy += 18;
      }
      ctx.fillStyle = s.sign.fg;
      ctx.font = font(13, "bold");
      for (const ch of chars) {
        ctx.fillText(ch, bx + 12, cy);
        cy += 15;
      }
      ctx.globalAlpha = 1;
    }

    // 行道樹的影子（畫在地上）
    function drawTreeShadow(t) {
      ctx.globalAlpha = t.fade;
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ellipse(t.x + 9, t.y + 11, t.r, t.r * 0.85);
      ctx.globalAlpha = 1;
    }

    // 行道樹的樹冠（畫在最上層：騎到樹下會被遮住，坑洞也比較難看清楚）
    function drawTreeCanopy(t) {
      const sway = Math.sin(frameCount * 0.02 + t.seed) * 1.5;
      const x = t.x + sway;
      ctx.globalAlpha = 0.86 * t.fade;
      ctx.fillStyle = "#2e7d32";
      circle(x, t.y, t.r);
      ctx.fillStyle = "#388e3c";
      circle(x - 4, t.y - 4, t.r * 0.74);
      ctx.fillStyle = "#4caf50";
      circle(x - 8, t.y - 9, t.r * 0.38);
      ctx.strokeStyle = "rgba(27,94,32,0.9)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, t.y, t.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 地面這一層的街景：店家、樹影
    function drawSceneryGround() {
      for (const s of scenery) {
        if (s.kind === "shop") drawShop(s);
        else drawTreeShadow(s);
      }
    }

    // 最上層：樹冠
    function drawSceneryOverhead() {
      for (const s of scenery) {
        if (s.kind === "tree") drawTreeCanopy(s);
      }
    }

    // ===== 第 5 步：障礙物 =====

    let obstacles = [];         // 目前畫面上的障礙物
    let obstacleTimer = 0;      // 計「騎了多遠」
    let nextObstacleTime = 160; // 下一波要再騎多遠才出現（每次隨機決定）

    // 機車、汽車的外觀（顏色隨機，每台都不一樣）
    const SCOOTER_COLORS = ["#e53935", "#f5f5f5", "#1e88e5", "#263238", "#f06292", "#43a047", "#fdd835", "#8e24aa", "#90a4ae", "#ff7043"];
    const HELMET_COLORS = ["#fdd835", "#fafafa", "#e53935", "#1e88e5", "#212121", "#ff9800", "#ec407a", "#26c6da"];
    const SHIRT_COLORS = ["#455a64", "#8d6e63", "#5c6bc0", "#26a69a", "#ef5350", "#eceff1", "#78909c", "#ab47bc"];
    const CAR_COLORS = ["#f5f5f5", "#9e9e9e", "#263238", "#c62828", "#1565c0", "#6d4c41", "#fdd835"];

    function giveLook(o) {
      o.color = pick(SCOOTER_COLORS);
      o.helmet = pick(HELMET_COLORS);
      o.shirt = pick(SHIRT_COLORS);
      return o;
    }
    function giveCarLook(o) {
      o.color = pick(CAR_COLORS);
      o.taxi = o.color === "#fdd835";   // 黃色就是計程車
      return o;
    }

    // 人行道上的坑洞（馬路是平的，凹凸不平的是人行道）
    // 很小、顏色跟地磚很像，要仔細看才看得到
    function spawnPothole() {
      const lane = Math.random() < 0.5 ? -1 : 3;
      obstacles.push({
        type: "pothole",
        lane: lane,
        x: laneX(lane) + randomBetween(-8, 8),               // 位置稍微隨機，不會剛好在正中間
        y: -40,
        variant: Math.random() < 0.5 ? "hole" : "tile"       // 小坑洞 或 翹起來的地磚
      });
    }

    // 違停在人行道上的機車（台南人行道的日常）
    function spawnParked() {
      const lane = Math.random() < 0.5 ? -1 : 3;
      obstacles.push(giveLook({
        type: "parked",
        lane: lane,
        x: laneX(lane) + randomBetween(-4, 4),
        y: -50,
        angle: (Math.random() - 0.5) * 0.6,
        noRider: true
      }));
    }

    // ===== 第 7 步：會動的障礙物 =====

    // 逆向機車：迎面衝過來
    function spawnWrongWay() {
      const lane = Math.floor(Math.random() * 3);
      obstacles.push(giveLook({
        type: "wrongway",
        lane: lane,
        x: lanes[lane],
        y: -60,
        ownSpeed: randomBetween(2, 4)   // 機車自己的車速（朝你衝過來）
      }));
    }

    // 亂切機車：跟你同方向。機車比腳踏車快，所以通常是從後面追上來超車，
    // 超過你之後突然切進你的車道，再來個急煞
    // phase（階段）：overtake 超車 → cutin 切進來 → brake 急煞 → leave 加速離開
    //               （你騎太快追得上它時：slow 前方慢慢騎）
    function makeSwerver(lane) {
      if (speed < 6) {
        // 一般情況：從後面（畫面下方外面）追上來
        return giveLook({
          type: "swerver",
          lane: lane,
          x: laneX(lane),
          y: 720,
          ownSpeed: randomBetween(60, 85) / 10,   // 機車車速 24 ~ 34 km/h，比你快
          targetSpeed: 0,
          phase: "overtake",
          timer: 0
        });
      }
      // 你騎很快：機車追不上你 → 改成在前方慢慢騎、亂切車道
      return giveLook({
        type: "swerver",
        lane: lane,
        x: laneX(lane),
        y: -40,
        ownSpeed: 2,
        targetSpeed: 2,
        phase: "slow",
        timer: randomBetween(30, 70)
      });
    }

    function spawnSwerver() {
      // 從你「旁邊」的車道超車（同一條車道會直接追撞你，現實中會繞開）
      const choices = [0, 1, 2].filter(l => l !== player.lane);
      obstacles.push(makeSwerver(pick(choices)));
    }

    // 騎人行道的機車：在人行道上從後面超車，然後切進馬路
    function spawnSidewalkRider() {
      let lane = Math.random() < 0.5 ? -1 : 3;
      if (lane === player.lane) {
        lane = lane === -1 ? 3 : -1;   // 你也在那邊人行道 → 換另一邊
      }
      obstacles.push(makeSwerver(lane));
    }

    // 從巷口（騎樓）衝出來，橫越人行道和馬路
    function spawnAlleyCrosser() {
      const dir = Math.random() < 0.5 ? 1 : -1;   // 1 = 從左邊衝出來往右
      const startX = dir === 1 ? 30 : 470;
      const crossSpeed = 5;

      // 算好時間：讓它大約在你騎到那裡時剛好衝到你面前（再加一點隨機誤差）
      const framesToReach = Math.abs(player.x - startX) / crossSpeed;
      let distanceAhead = speed * (framesToReach + randomBetween(-8, 15));
      distanceAhead = Math.max(distanceAhead, 120);   // 不要近到根本閃不掉

      obstacles.push(giveLook({
        type: "crosser",
        kind: "scooter",
        label: "巷口衝出！",
        color2: "#ff9100",
        x: startX,
        y: player.y - distanceAhead,
        vx: crossSpeed * dir,
        hitW: 36,
        hitH: 26,
        hitMsg: "🛵 被巷口衝出的機車撞了！"
      }));
      Sound.hornShort();
    }

    // 產生一波障礙物：隨機決定是哪一種
    function spawnObstacle() {
      // 公平規則：畫面上一次最多一台直向機車、一台橫向衝出的機車
      const hasScooter = obstacles.some(o => o.type === "wrongway" || o.type === "swerver");
      const hasCrosser = obstacles.some(o => o.type === "crosser");

      // 先擲骰子決定想生什麼；不能生的話就改生人行道坑洞
      const roll = Math.random();   // 0 ~ 1
      if (roll < 0.2) {
        if (!hasScooter) spawnWrongWay();
        else spawnPothole();
      } else if (roll < 0.36) {
        if (!hasScooter) spawnSwerver();
        else spawnPothole();
      } else if (roll < 0.5) {
        if (!hasScooter) spawnSidewalkRider();
        else spawnPothole();
      } else if (roll < 0.62) {
        // 巷口衝出（騎太慢時不出現，因為它是算好時間衝向你的）
        if (!hasCrosser && speed > 1.5) spawnAlleyCrosser();
        else spawnPothole();
      } else if (roll < 0.74) {
        spawnParked();
      } else {
        spawnPothole();
      }
    }

    // 依照種類，移動一個障礙物（scroll = 地面這一幀往下移多少）
    function moveObstacle(o, scroll) {
      if (o.type === "pothole" || o.type === "parked") {
        // 坑洞、違停機車是固定在地上的，跟路同速
        o.y = o.y + scroll;
      } else if (o.type === "wrongway") {
        // 逆向：你往前騎 + 它往你衝 → 兩個速度相加，所以特別快
        o.y = o.y + scroll + o.ownSpeed;
        if (!o.honked && o.y > 10) {
          o.honked = true;
          Sound.horn();   // 叭叭！
        }

        // 你騎很慢時，它看得到你 → 快接近時換到旁邊的車道繞過你
        const ahead = player.y - o.y;   // 它在你前方多遠
        if (speed < SAFE_SPEED && ahead > 0 && ahead < 220 && Math.abs(o.x - player.x) < 60) {
          const choices = [o.lane - 1, o.lane + 1].filter(l => l >= 0 && l <= 2 && Math.abs(laneX(l) - player.x) >= 60);
          if (choices.length > 0) o.lane = pick(choices);
        }
        o.x = o.x + (laneX(o.lane) - o.x) * 0.05;   // 平滑地滑到新車道（數字越小越慢）
      } else if (o.type === "swerver") {
        // 同方向：畫面上的移動 = 你的速度 - 它的速度
        //   它比你快 → 往上跑（從後面超過你）；它比你慢 → 往下（你追上它）
        o.y = o.y + scroll - o.ownSpeed;

        if (o.phase === "overtake") {
          // 已經超過你、在你前方 80 像素 → 突然切進你的車道（沒打方向燈），一邊切一邊煞車
          if (o.y < player.y - 80) {
            o.fromLane = o.lane;
            o.lane = clamp(player.lane, 0, 2);   // 只切進馬路的車道
            o.phase = "cutin";
            o.targetSpeed = 0.5;
          }
        } else if (o.phase === "cutin") {
          // 切到定位 → 繼續急煞一段時間（要停路邊、要轉進巷子…）
          if (Math.abs(o.x - laneX(o.lane)) < 6) {
            o.phase = "brake";
            o.timer = randomBetween(60, 110);
            if (o.y > 0 && o.y < 600) Sound.screech();   // 吱——！
          }
        } else if (o.phase === "brake") {
          o.timer = o.timer - 1;
          if (o.timer <= 0) {
            o.phase = "leave";       // 煞完了，加速離開
            o.targetSpeed = 8;
          }
        } else if (o.phase === "slow") {
          // 前方慢慢騎的機車：時間到就隨機換車道
          o.timer = o.timer - 1;
          if (o.timer <= 0) {
            o.lane = pick([o.lane - 1, o.lane + 1].filter(l => l >= 0 && l <= 2));
            o.timer = randomBetween(40, 100);
          }
        }

        // 機車的車速也是慢慢變化（有煞車距離、要時間加速）
        if (o.phase === "cutin" || o.phase === "brake" || o.phase === "leave") {
          o.ownSpeed = o.ownSpeed + (o.targetSpeed - o.ownSpeed) * 0.02;   // 數字越小，加減速越慢
        }
        o.x = o.x + (laneX(o.lane) - o.x) * 0.03;   // 數字越小，換車道越慢
      } else if (o.type === "crosser") {
        // 橫向衝的車：跟著地面往下，自己再橫向移動
        o.y = o.y + scroll;
        o.x = o.x + o.vx;

        // 闖紅燈的懲罰車：一定會追著你撞（你闖紅燈就躲不掉）
        if (o.homing) {
          o.y = player.y;
        }
      }
    }

    // 更新障礙物：計距離、生新的、移動、刪掉離開畫面的
    function updateObstacles() {
      const scroll = turning ? 0 : speed;   // 轉彎時地面不捲動

      if (!turning) {
        // 用「距離」決定何時出現：騎得慢，障礙就來得慢
        obstacleTimer = obstacleTimer + speed;
        if (obstacleTimer >= nextObstacleTime) {
          if (!isNearIntersection(-40, 60) && !gate) {   // 路口和校門附近不放
            spawnObstacle();
          }
          obstacleTimer = 0;
          // 越危險的路線，障礙物越密集
          nextObstacleTime = randomBetween(120, 280) / currentDanger();
        }
      }

      for (const o of obstacles) {
        moveObstacle(o, scroll);
      }

      // 只保留還在畫面附近的
      obstacles = obstacles.filter(o => {
        if (o.type === "crosser") return o.x > -120 && o.x < 620 && o.y < 700;
        if (o.type === "swerver") return o.y < 800 && o.y > -150;
        return o.y < 660 && o.y > -150;
      });
    }

    // ----- 畫障礙物 -----

    // 人行道坑洞：故意畫得很小、顏色接近地磚，不太明顯
    function drawPothole(o) {
      if (o.variant === "hole") {
        ctx.fillStyle = "#8a4a37";
        ellipse(o.x, o.y, 10, 6);
        ctx.fillStyle = "#5e3125";
        ellipse(o.x, o.y + 1, 6, 3);
      } else {
        // 翹起來的地磚：歪一點點的磚塊，下緣有陰影
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(0.25);
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(-8, -4, 18, 11);
        ctx.fillStyle = "#c4785d";
        ctx.fillRect(-9, -6, 18, 11);
        ctx.restore();
      }
    }

    // 從正上方看的機車（車頭朝上）
    function drawScooterSprite(o, brake, headlight) {
      // 影子
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ellipse(4, 6, 15, 32);

      // 頭燈光束（逆向車特別顯眼）
      if (headlight) {
        const g = ctx.createLinearGradient(0, -30, 0, -100);
        g.addColorStop(0, "rgba(255,250,200,0.5)");
        g.addColorStop(1, "rgba(255,250,200,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(-6, -30);
        ctx.lineTo(-28, -100);
        ctx.lineTo(28, -100);
        ctx.lineTo(6, -30);
        ctx.closePath();
        ctx.fill();
      }

      // 輪胎
      ctx.fillStyle = "#1c1c1c";
      rr(-3.5, -33, 7, 13, 3); ctx.fill();
      rr(-3.5, 20, 7, 13, 3); ctx.fill();

      // 車身、車頭、腳踏板、座墊
      ctx.fillStyle = o.color;
      rr(-12, -27, 24, 52, 11); ctx.fill();
      ctx.fillStyle = shade(o.color, -35);
      rr(-11, -27, 22, 12, 8); ctx.fill();
      ctx.fillStyle = "#37474f";
      rr(-9, -14, 18, 12, 3); ctx.fill();
      ctx.fillStyle = "#1f1f1f";
      rr(-8, 0, 16, 20, 6); ctx.fill();

      // 尾燈（煞車時亮紅光）
      if (brake) {
        ctx.save();
        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#ff1744";
        rr(-8, 22, 16, 4, 2); ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = "#8e1b1b";
        rr(-7, 23, 14, 3.5, 1.5); ctx.fill();
      }

      // 頭燈
      ctx.fillStyle = "#fffde7";
      circle(0, -26, 2.6);

      // 把手和後照鏡
      ctx.strokeStyle = "#2b2b2b";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      line(-15, -17, 15, -17);
      ctx.fillStyle = "#2b2b2b";
      circle(-16, -21, 3);
      circle(16, -21, 3);

      if (o.noRider) return;   // 違停的機車沒有人

      // 騎士：身體、手臂、安全帽
      ctx.fillStyle = o.shirt;
      rr(-11, -6, 22, 16, 7); ctx.fill();
      ctx.strokeStyle = o.shirt;
      ctx.lineWidth = 4.5;
      line(-10, -3, -13, -15);
      line(10, -3, 13, -15);
      ctx.fillStyle = "#d7a77b";
      circle(-13, -16, 2.5);
      circle(13, -16, 2.5);
      ctx.fillStyle = o.helmet;
      circle(0, -5, 8);
      ctx.fillStyle = "rgba(20,30,40,0.75)";
      ellipse(0, -10, 5.5, 2.6);
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      circle(-2.5, -3, 2.5);
    }

    // 從正上方看的汽車（車頭朝上）
    function drawCarSprite(o) {
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ellipse(5, 7, 24, 45);
      ctx.fillStyle = o.color;
      rr(-21, -42, 42, 84, 10); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      rr(-21, -42, 42, 18, 10); ctx.fill();
      // 車窗、車頂
      ctx.fillStyle = "rgba(25,40,60,0.88)";
      rr(-17, -23, 34, 15, 4); ctx.fill();
      ctx.fillStyle = o.color === "#263238" ? "#37474f" : shade(o.color, 18);
      rr(-17, -7, 34, 26, 5); ctx.fill();
      ctx.fillStyle = "rgba(25,40,60,0.8)";
      rr(-16, 20, 32, 10, 4); ctx.fill();
      // 車燈
      ctx.fillStyle = "#fff8c4";
      rr(-18, -42, 9, 4, 2); ctx.fill();
      rr(9, -42, 9, 4, 2); ctx.fill();
      ctx.fillStyle = "#d50000";
      rr(-18, 38, 9, 4, 2); ctx.fill();
      rr(9, 38, 9, 4, 2); ctx.fill();
      // 後照鏡
      ctx.fillStyle = o.color;
      rr(-25, -18, 5, 6, 2); ctx.fill();
      rr(20, -18, 5, 6, 2); ctx.fill();
      // 計程車的車頂燈
      if (o.taxi) {
        ctx.fillStyle = "#fafafa";
        rr(-9, 1, 18, 8, 2); ctx.fill();
        ctx.fillStyle = "#212121";
        ctx.font = font(6, "bold");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("TAXI", 0, 5);
      }
    }

    // 頭上的標籤先記下來，最後才畫（才不會被樹擋住）
    let tagQueue = [];
    function queueTag(text, x, y, color) {
      tagQueue.push({ text: text, x: x, y: y, color: color });
    }
    function drawTags() {
      ctx.font = font(12, "bold");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const t of tagQueue) {
        const w = ctx.measureText(t.text).width + 14;
        rr(t.x - w / 2, t.y - 10, w, 20, 10);
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fill();
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y + 1);
      }
      tagQueue = [];
    }

    // 畫一台車（機車或汽車），依照行進方向轉向
    function drawVehicle(o) {
      let heading = 0;   // 0 = 車頭朝上
      let lean = 0;
      if (o.type === "wrongway") {
        heading = Math.PI;
        lean = -(laneX(o.lane) - o.x) * 0.006;
      } else if (o.type === "swerver") {
        lean = (laneX(o.lane) - o.x) * 0.006;
      } else if (o.type === "crosser") {
        heading = o.vx > 0 ? Math.PI / 2 : -Math.PI / 2;
      } else if (o.type === "parked") {
        heading = o.angle;
      }

      const braking = o.type === "swerver" && (o.phase === "brake" || (o.phase === "cutin" && o.ownSpeed < 5));
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(heading + lean);
      if (o.kind === "car") drawCarSprite(o);
      else drawScooterSprite(o, braking, o.type === "wrongway");
      ctx.restore();

      // 頭上的警告標籤
      let label = "";
      let color = "#fff";
      if (o.type === "wrongway") {
        label = "逆向！"; color = "#ff5252";
      } else if (o.type === "swerver") {
        if (o.phase === "brake") { label = "急煞！"; color = "#ff5252"; }
        else if (o.lane === -1 || o.lane === 3) { label = "騎人行道！"; color = "#ffab40"; }
        else if (o.phase === "cutin" || o.phase === "slow") { label = "亂切！"; color = "#ffd740"; }
        else if (o.phase === "overtake") { label = "超車"; color = "#e0e0e0"; }
      } else if (o.type === "crosser" && o.label) {
        label = o.label; color = o.color2;
      }
      if (label) queueTag(label, o.x, o.y - (o.kind === "car" ? 34 : 40), color);
    }

    // 畫出所有障礙物：先畫地上的（坑洞），再畫車子
    function drawGroundObstacles() {
      for (const o of obstacles) {
        if (o.type === "pothole") drawPothole(o);
      }
    }
    function drawVehicles() {
      for (const o of obstacles) {
        if (o.type !== "pothole") drawVehicle(o);
      }
    }

    // 後方來車警告：機車還在畫面下方外面時，在底部邊緣提醒你
    function drawRearWarnings() {
      if (turning) return;
      for (const o of obstacles) {
        if (o.type === "swerver" && o.y > 600) {
          const blink = Math.floor(frameCount / 8) % 2 === 0;
          rr(o.x - 46, 568, 92, 24, 12);
          ctx.fillStyle = blink ? "rgba(198,40,40,0.95)" : "rgba(120,20,20,0.95)";
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = font(12, "bold");
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("⚠ 後方來車 ▲", o.x, 581);
        }
      }
    }

    // ===== 特效：碎片、得分飄字、煞車痕、彩帶 =====
    let particles = [];
    let popups = [];
    let skids = [];
    let confetti = [];
    let hitFlash = 0;

    // 在 (x, y) 噴出一團碎片
    function burst(x, y, colors, n, power) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = (0.5 + Math.random()) * power;
        particles.push({
          x: x, y: y,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          life: 30 + Math.random() * 25, max: 55,
          size: 1.5 + Math.random() * 3,
          color: pick(colors)
        });
      }
    }

    // 飄起來的文字（例如「好險！+50」）
    function addPopup(text, x, y, color) {
      popups.push({ text: text, x: x, y: y, color: color, life: 75 });
    }

    function spawnConfetti() {
      for (let i = 0; i < 150; i++) {
        confetti.push({
          x: Math.random() * W, y: -20 - Math.random() * 400,
          vx: (Math.random() - 0.5) * 2, vy: 1.5 + Math.random() * 2.5,
          rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
          w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
          color: pick(["#ff5252", "#ffd740", "#69f0ae", "#40c4ff", "#e040fb", "#ffffff"])
        });
      }
    }

    function updateFx(scroll) {
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy + scroll;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life--;
      }
      particles = particles.filter(p => p.life > 0);
      for (const p of popups) {
        p.y += scroll - 0.8;
        p.life--;
      }
      popups = popups.filter(p => p.life > 0);
      for (const s of skids) {
        s.y += scroll;
        s.life--;
      }
      skids = skids.filter(s => s.life > 0 && s.y < 700);
      if (hitFlash > 0) hitFlash--;
    }

    function updateConfetti() {
      for (const c of confetti) {
        c.x += c.vx + Math.sin((frameCount + c.rot * 50) * 0.05) * 0.6;
        c.y += c.vy;
        c.rot += c.vr;
      }
      confetti = confetti.filter(c => c.y < 640);
    }

    function drawSkids() {
      for (const s of skids) {
        ctx.fillStyle = "rgba(15,15,15," + (s.life / 220 * 0.45) + ")";
        ctx.fillRect(s.x - 1.5, s.y, 3, s.len);
      }
    }
    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.min(1, p.life / 25);
        ctx.fillStyle = p.color;
        circle(p.x, p.y, p.size);
      }
      ctx.globalAlpha = 1;
    }
    function drawPopups() {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = font(16, "900");
      for (const p of popups) {
        ctx.globalAlpha = Math.min(1, p.life / 20);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(0,0,0,0.75)";
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
    }
    function drawConfetti() {
      for (const c of confetti) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }
    }

    // ===== 第 7.5 步：十字路口、紅綠燈、轉彎 =====

    const STREET_NAMES = ["中華路", "民族路", "府前路", "海安路", "東寧路", "大學路",
                          "北門路", "中正路", "金華路", "健康路", "成功路", "公園路"];
    let currentStreet = "北門路";   // 現在騎在哪條路上

    let intersection = null;        // 目前的路口（一次最多一個）
    let intersectionTimer = 0;      // 計「騎了多遠」
    let nextIntersectionDist = 900; // 再騎多遠出現下一個路口
    let crossTrafficTimer = 0;      // 紅燈時，橫向車流多久來一台

    let turnQueued = 0;   // 0 = 直走、1 = 準備右轉、-1 = 準備左轉
    let turning = null;   // 正在轉彎時的資料（沒在轉彎時是 null）
    const TURN_RADIUS = 60;         // 轉彎半徑

    // 路口的地面標線位置（從路口中心往下算幾像素）
    //   154 ~ 188：斑馬線
    //   192      ：機車停等區前緣 = 闖紅燈判定線（紅綠燈立在這條線兩邊）
    //   192 ~ 282：機車停等區（90 像素深，整台腳踏車停得進去）
    //   284      ：汽車停止線
    const STOP_LINE = 192;
    const WAIT_BOX_END = 282;

    // 紅綠燈：每種燈亮多久（幀），以及下一個燈是什麼
    const LIGHT_TIME = { green: 300, yellow: 90, red: 300 };
    const NEXT_LIGHT = { green: "yellow", yellow: "red", red: "green" };

    // ===== 第 7.8 步：目的地（成大各校區）=====
    // 校區、系館、路名、事故熱點都是真實資料；路線和距離為了遊戲有簡化
    // 熱點路口：台南市警一分局公布的東區十大肇事路口
    // 易肇事路段：台南市警察局公布的十大易肇事路段
    // 距離單位是像素，畫面上顯示時 ÷ 10 當作公尺
    const DESTINATIONS = [
      {
        campus: "成功校區", building: "工程科學系館", stars: 1, danger: 0.8,
        route: [
          { street: "北門路", length: 2400, turn: -1 },
          { street: "大學路", length: 3000 }
        ]
      },
      {
        campus: "光復校區", building: "管理學院", stars: 2, danger: 1.0,
        route: [
          { street: "北門路", length: 2400, turn: -1 },
          { street: "大學路", length: 2600, turn: 1, hotspot: "大學路×勝利路（東區十大肇事路口）" },
          { street: "勝利路", length: 2400 }
        ]
      },
      {
        campus: "勝利校區", building: "K館（舊總圖書館）", stars: 2, danger: 1.1,
        route: [
          { street: "北門路", length: 3000, turn: 1, hotspot: "北門路×民族路（東區十大肇事路口）" },
          { street: "民族路", length: 2800, turn: -1 },
          { street: "勝利路", length: 2800 }
        ]
      },
      {
        campus: "自強校區", building: "機械系館", stars: 3, danger: 1.25,
        route: [
          { street: "北門路", length: 2400, turn: -1 },
          { street: "大學路", length: 2600, turn: 1, hotspot: "大學路×勝利路（東區十大肇事路口）" },
          { street: "勝利路", length: 3000, turn: -1 },
          { street: "小東路", length: 2800 }
        ]
      },
      {
        campus: "成杏校區", building: "醫學院", stars: 4, danger: 1.4,
        route: [
          { street: "北門路", length: 2400, turn: -1 },
          { street: "大學路", length: 2400, turn: 1, hotspot: "大學路×勝利路（東區十大肇事路口）" },
          { street: "勝利路", length: 2600, turn: -1, hotspot: "勝利路×東寧路（東區肇事第 1 名）" },
          { street: "東寧路", length: 2400, turn: 1 },
          { street: "小東路", length: 2600 }
        ]
      },
      {
        campus: "力行校區", building: "心理系館", stars: 4, danger: 1.5,
        route: [
          { street: "北門路", length: 3000, turn: 1, hotspot: "北門路×民族路（東區十大肇事路口）" },
          { street: "民族路", length: 3000, turn: -1 },
          { street: "中華東路", length: 3200, turn: 1, hotspot: "中華東路×小東路（東區十大肇事路口）",
            dangerBoost: 0.3, warning: "台南十大易肇事路段" },
          { street: "小東路", length: 2800 }
        ]
      },
      {
        campus: "歸仁校區", building: "校區大門", stars: 5, danger: 1.7,
        route: [
          { street: "北門路", length: 3000, turn: 1, hotspot: "北門路×民族路（東區十大肇事路口）" },
          { street: "民族路", length: 2600, turn: -1 },
          { street: "東門路", length: 4500, turn: 1, dangerBoost: 0.3, warning: "台南十大易肇事路段" },
          { street: "仁德中正路", length: 5000, dangerBoost: 0.3, warning: "台南十大易肇事路段" }
        ]
      }
    ];

    let dest = DESTINATIONS[0];   // 這一局的目的地
    let segIndex = 0;             // 現在走到路線的第幾段
    let segDistance = 0;          // 在這一段騎了多遠
    let gate = null;              // 校門（快到時才出現）
    let elapsedFrames = 0;        // 出發後經過幾幀（60 幀 = 1 秒）
    let inMenu = true;            // 是否在選目的地的畫面
    let menuIndex = 0;            // 選單目前選到第幾個
    let won = false;              // 是否抵達目的地

    function currentSeg() {
      return dest.route[segIndex];
    }

    // 目前的危險程度：目的地本身 + 這條路是不是易肇事路段
    function currentDanger() {
      return dest.danger + (currentSeg().dangerBoost || 0);
    }

    function totalLength(d) {
      return d.route.reduce((sum, s) => sum + s.length, 0);
    }

    // 上課時限（秒）：照距離算，每個要轉彎的路口多給 5 秒等紅燈
    function timeLimit(d) {
      return Math.round(totalLength(d) / 150 + (d.route.length - 1) * 5);
    }

    // 秒數 → 「分:秒」
    function formatTime(sec) {
      const s = Math.max(0, Math.round(sec));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    // 路線完成了幾成（0 ~ 1）
    function routeProgress() {
      let done = 0;
      for (let i = 0; i < segIndex; i++) done += dest.route[i].length;
      done += Math.min(segDistance, currentSeg().length);
      return clamp(done / totalLength(dest), 0, 1);
    }

    // 隨機挑一個「不是現在這條」的路名
    function randomStreetName() {
      let name;
      do {
        name = pick(STREET_NAMES);
      } while (name === currentStreet);
      return name;
    }

    // 產生一個新路口（isRoute = 是不是導航要你轉彎的路口）
    function spawnIntersection(isRoute) {
      const light = pick(["green", "yellow", "red"]);
      const seg = currentSeg();

      intersection = {
        y: -400,                                     // 路口中心（橫向馬路的中線）
        light: light,                                // 目前的燈號
        lightTimer: randomBetween(30, LIGHT_TIME[light]),
        crossDir: Math.random() < 0.5 ? 1 : -1,      // 橫向馬路是單行道：1 = 往右、-1 = 往左
        name: randomStreetName(),                    // 橫向馬路的名字
        passed: false,                               // true = 轉彎後留在身後的舊路口
        passedStopLine: false,                       // 你是不是已經騎過停止線了
        runner: null,                                // 這個路口會不會有人闖紅燈
        isRoute: isRoute,                            // 導航路口：要在這裡轉彎
        hotspot: null,                               // 事故熱點的名字
        handled: false,                              // 已經轉彎或錯過了
        perfectAwarded: false                        // 已經拿過「完美停車」加分
      };
      clearSceneryInBand(intersection);

      // 導航路口：方向和路名照路線走
      if (isRoute) {
        intersection.crossDir = seg.turn;
        intersection.name = dest.route[segIndex + 1].street;
        intersection.hotspot = seg.hotspot || null;
        if (intersection.hotspot) {
          message = "⚠️ 前方事故熱點！";
          messageTimer = 120;
        }
      }

      // 會不會有人闖紅燈：事故熱點一定有，其他路口看危險程度
      const runnerChance = intersection.hotspot ? 1 : Math.min(0.9, 0.35 * currentDanger());
      if (Math.random() < runnerChance) {
        intersection.runner = {
          row: pick([-100, 0, 100]),                 // 從橫向馬路的哪一條車道衝出來
          dir: Math.random() < 0.5 ? 1 : -1,
          jitter: randomBetween(-12, 20),            // 時間誤差：不一定剛好撞到你
          spawned: false
        };
      }
    }

    // 某個 y 位置是否在路口範圍內（margin = 額外的安全距離）
    function isNearIntersection(y, margin) {
      return intersection !== null && Math.abs(y - intersection.y) < 190 + margin;
    }

    // 紅燈時：橫向的車流（綠燈方向的正常車輛）
    function spawnCrossCar() {
      const I = intersection;
      const isCar = Math.random() < 0.5;
      const o = {
        type: "crosser",
        kind: isCar ? "car" : "scooter",
        label: "",
        x: I.crossDir === 1 ? -70 : 570,
        y: I.y + pick([-100, 0, 100]),
        vx: I.crossDir * randomBetween(5, 7),
        hitW: isCar ? 44 : 36,
        hitH: 26,
        hitMsg: "🚗 被橫向來車撞了！"
      };
      obstacles.push(isCar ? giveCarLook(o) : giveLook(o));
    }

    // 綠燈時：橫向有人闖紅燈，算好時間衝向你
    function tryRunner(I) {
      const r = I.runner;
      const rowY = I.y + r.row;
      if (rowY > player.y - 40) {        // 你已經騎過那一排了
        r.spawned = true;
        return;
      }
      const startX = r.dir === 1 ? -40 : 540;
      const framesForRunner = Math.abs(player.x - startX) / 6;          // 它衝到你的車道要幾幀
      const framesForMe = (player.y - rowY) / Math.max(speed, 0.3);     // 你騎到那一排要幾幀
      if (framesForMe <= framesForRunner + r.jitter) {
        obstacles.push(giveLook({
          type: "crosser",
          kind: "scooter",
          label: "闖紅燈！",
          color2: "#ff5252",
          x: startX,
          y: rowY,
          vx: 6 * r.dir,
          hitW: 36,
          hitH: 26,
          hitMsg: "🛵 被闖紅燈的機車撞了！"
        }));
        r.spawned = true;
        message = "⚠️ 有人闖紅燈！";
        messageTimer = 45;
        Sound.hornShort();
      }
    }

    // 你闖紅燈了：橫向一台車直接衝向你（必定撞到）
    function punishRedLight() {
      const fromLeft = Math.random() < 0.5;
      obstacles.push(giveCarLook({
        type: "crosser",
        kind: "car",
        label: "",
        x: fromLeft ? -70 : 570,
        y: player.y,
        vx: fromLeft ? 12 : -12,
        hitW: 44,
        hitH: 40,
        homing: true,     // 會一直對準你的 y，躲不掉
        fatal: true,      // 撞到直接死亡
        hitMsg: "🚑 闖紅燈被撞了！"
      }));
      message = "🚨 你闖紅燈了！";
      messageTimer = 60;
      Sound.horn();
      Sound.screech();
    }

    // 更新路口：生成、移動、紅綠燈、車流、闖紅燈判定、轉彎
    function updateIntersection() {
      // 1. 生新路口
      if (!turning && intersection === null) {
        const seg = currentSeg();
        intersectionTimer = intersectionTimer + speed;
        if (seg.turn && segDistance >= seg.length - 760) {
          // 快到導航要轉彎的地方了 → 生導航路口
          spawnIntersection(true);
        } else if (intersectionTimer >= nextIntersectionDist && segDistance < seg.length - 2200) {
          // 一般路口（離導航路口夠遠時才生，免得擋到）
          spawnIntersection(false);
          intersectionTimer = 0;
          nextIntersectionDist = randomBetween(1500, 2500);
        }
      }
      if (intersection === null) return;
      const I = intersection;

      // 2. 路口固定在地上，跟著路往下移
      if (!turning) {
        I.y = I.y + speed;
      }

      // 3. 紅綠燈倒數，時間到就換下一個燈
      I.lightTimer = I.lightTimer - 1;
      if (I.lightTimer <= 0) {
        I.light = NEXT_LIGHT[I.light];
        I.lightTimer = LIGHT_TIME[I.light];
        if (!I.passed && !I.passedStopLine && I.y > -300) Sound.beep();
      }

      // 4. 你這邊紅燈 = 橫向綠燈 → 橫向有車流
      if (I.light === "red" && I.y > -450 && I.y < 800) {
        crossTrafficTimer = crossTrafficTimer - 1;
        if (crossTrafficTimer <= 0) {
          spawnCrossCar();
          crossTrafficTimer = randomBetween(20, 45);
        }
      }

      // 5. 你這邊綠燈 = 橫向紅燈 → 可能有人闖紅燈
      if (!I.passed && I.runner && !I.runner.spawned && I.light === "green") {
        tryRunner(I);
      }

      // 6. 停止線碰到車頭的那一刻：如果是紅燈 → 你闖紅燈了
      // 判定線 = 機車停等區的前緣（紅綠燈就立在這條線兩邊）
      // 車頭用「菜籃最前面」來算，跟畫面上看到的一樣：整台車停在停等區裡面是合法的
      const stopLineY = I.y + STOP_LINE;
      const bikeFront = player.y - 36;
      if (!I.passed && !I.passedStopLine && stopLineY >= bikeFront) {
        I.passedStopLine = true;
        if (I.light === "red") {
          punishRedLight();
        }
      }

      // 6.5 紅燈時穩穩停在停止線前 → 完美停車加分
      if (!I.passed && !I.passedStopLine && !I.perfectAwarded && I.light === "red" && speed < 0.05) {
        const gap = bikeFront - stopLineY;
        if (gap >= 0 && gap < 60) {
          I.perfectAwarded = true;
          stats.perfectStop++;
          addPopup("完美停車 +100", player.x, player.y - 50, "#69f0ae");
          Sound.coin();
        }
      }

      // 7. 準備轉彎，而且騎到轉彎點了 → 開始轉
      if (turnQueued !== 0 && !turning && I.y + 100 + TURN_RADIUS >= player.y) {
        startTurn();
      }

      // 7.5 導航路口沒轉彎就騎過去了 → 重新規劃路線（多騎一段）
      if (I.isRoute && !I.handled && !turning && I.y + 100 + TURN_RADIUS > player.y + 10) {
        I.handled = true;
        segDistance = currentSeg().length - 1500;
        message = "🔄 錯過路口！重新規劃路線";
        messageTimer = 90;
      }

      // 8. 路口離開畫面就刪掉
      if (I.y > 900) {
        intersection = null;
      }
    }

    // 開始轉彎：腳踏車沿著一段 1/4 圓弧前進
    function startTurn() {
      const dir = turnQueued;
      turning = {
        dir: dir,                                // 1 = 右轉、-1 = 左轉
        phi: 0,                                  // 已經轉了幾度（0 ~ 90 度，用弧度表示）
        cx: player.x + dir * TURN_RADIUS,        // 圓弧的圓心
        cy: player.y,
        anchorX: laneX(dir === 1 ? 2 : 0)        // 腳踏車在畫面上固定的位置
      };
      turnQueued = 0;
      player.vx = 0;
      intersection.handled = true;
    }

    // 轉彎中：沿著圓弧前進，畫面跟著旋轉
    function updateTurn() {
      updateSpeed();   // 轉彎中一樣可以加速、煞車

      // 沿著圓弧走：走的距離 = 車速，換算成角度 = 距離 ÷ 半徑
      turning.phi = turning.phi + speed / TURN_RADIUS;
      if (turning.phi > Math.PI / 2) {
        turning.phi = Math.PI / 2;               // 最多轉 90 度
      }

      // 圓弧上的位置（cos、sin 就是在畫圓）
      player.x = turning.cx - turning.dir * TURN_RADIUS * Math.cos(turning.phi);
      player.y = turning.cy - TURN_RADIUS * Math.sin(turning.phi);
      player.tilt = turning.dir * 0.25;          // 轉彎時車身往內側傾

      if (turning.phi >= Math.PI / 2) {
        finishTurn();
      }
    }

    // 轉完了：把整個世界轉 90 度，變成新的街道
    function finishTurn() {
      const dir = turning.dir;
      const ex = player.x;          // 轉完時，腳踏車在「舊街道座標」的位置
      const ey = player.y;
      const newX = turning.anchorX;
      const newY = 520;
      const newStreet = intersection.name;

      // 把舊座標的一個點換算成新座標（以腳踏車為中心，整個世界轉 90 度）
      function toNew(x, y) {
        const dx = x - ex;
        const dy = y - ey;
        if (dir === 1) {
          return { x: newX + dy, y: newY - dx };   // 右轉：世界逆時針轉
        } else {
          return { x: newX - dy, y: newY + dx };   // 左轉：世界順時針轉
        }
      }

      // 會動的車子直接清掉；坑洞、違停機車是固定在地上的，換算到新座標
      obstacles = obstacles.filter(o => o.type === "pothole" || o.type === "parked");
      for (const o of obstacles) {
        const p = toNew(o.x, o.y);
        o.x = p.x;
        o.y = p.y;
        if (o.type === "parked") o.angle += dir === 1 ? -Math.PI / 2 : Math.PI / 2;
      }
      for (const s of skids) {
        const p = toNew(s.x, s.y);
        s.x = p.x;
        s.y = p.y;
      }
      particles = [];
      popups = [];

      // 原本騎的那條路 → 變成身後的橫向馬路
      const oldRoad = toNew(250, ey);
      intersection = {
        y: oldRoad.y,
        light: "green",
        lightTimer: 99999,
        crossDir: 0,
        name: currentStreet,
        passed: true,
        passedStopLine: true,
        runner: null
      };

      // 新街道的店家、行道樹重新長出來（淡入）
      scenery = [];
      fillScenery(-160, true);

      // 路線前進到下一段
      segIndex = segIndex + 1;
      segDistance = 0;

      // 腳踏車回到新街道的正常位置
      currentStreet = newStreet;
      player.x = newX;
      player.y = newY;
      player.lane = dir === 1 ? 2 : 0;
      player.vx = 0;
      player.tilt = 0;
      turning = null;
      intersectionTimer = 0;
      obstacleTimer = 0;

      const seg = currentSeg();
      message = seg.warning ? "⚠️ " + newStreet + "：" + seg.warning : "📍 轉進" + newStreet;
      messageTimer = 100;
    }

    // 畫路口：橫向馬路、人行道、斑馬線、機車停等區、停止線、路名牌
    function drawIntersection(I) {
      // 橫向馬路兩側的紅磚人行道、橫向馬路、直向馬路穿過去的部分
      fillScrolling(patterns.brick, 24, -1000, I.y - 190, 2500, 380);
      fillScrolling(patterns.asphalt, 128, -1000, I.y - 150, 2500, 300);
      fillScrolling(patterns.asphalt, 128, 100, I.y - 190, 300, 380);

      // 轉角的路緣石
      ctx.fillStyle = "#c9c9c9";
      ctx.fillRect(-1000, I.y - 153, 1100, 3);
      ctx.fillRect(400, I.y - 153, 1100, 3);
      ctx.fillRect(-1000, I.y + 150, 1100, 3);
      ctx.fillRect(400, I.y + 150, 1100, 3);

      // 斑馬線
      ctx.fillStyle = "rgba(238,238,238,0.92)";
      for (let x = 108; x < 396; x += 28) {
        ctx.fillRect(x, I.y + 154, 14, 34);
        ctx.fillRect(x, I.y - 188, 14, 34);
      }
      for (let y = I.y - 142; y < I.y + 146; y += 28) {
        ctx.fillRect(62, y, 36, 14);
        ctx.fillRect(402, y, 36, 14);
      }

      if (!I.passed) {
        // 機車停等區（腳踏車也停這裡）：整台車停在框框裡面就是合法的
        ctx.strokeStyle = "rgba(255,255,255,0.92)";
        ctx.lineWidth = 3;
        ctx.strokeRect(108, I.y + STOP_LINE, 284, WAIT_BOX_END - STOP_LINE);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.font = font(15, "bold");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("機 車 停 等 區", 250, I.y + (STOP_LINE + WAIT_BOX_END) / 2);

        // 前緣（闖紅燈判定線）畫粗一點，紅燈時變紅色提醒
        ctx.fillStyle = I.light === "red" ? "rgba(255,82,82,0.95)" : "#fff";
        ctx.fillRect(106, I.y + STOP_LINE - 3, 288, 6);

        // 汽車停止線
        ctx.fillStyle = "#fff";
        ctx.fillRect(106, I.y + WAIT_BOX_END + 2, 288, 6);

        // 路面上的「慢」字（要轉彎的那條車道畫箭頭，不畫慢字）
        ctx.fillStyle = "rgba(255,255,255,0.72)";
        ctx.font = font(40, "900");
        for (let lane = 0; lane < 3; lane++) {
          if (I.isRoute && !I.handled && lane === (I.crossDir === 1 ? 2 : 0)) continue;
          ctx.fillText("慢", lanes[lane], I.y + 360);
        }
      }

      // 橫向馬路的車道線
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 4;
      ctx.setLineDash([30, 20]);
      ctx.lineDashOffset = 0;
      ctx.beginPath();
      ctx.moveTo(-1000, I.y - 50);
      ctx.lineTo(60, I.y - 50);
      ctx.moveTo(-1000, I.y + 50);
      ctx.lineTo(60, I.y + 50);
      ctx.moveTo(440, I.y - 50);
      ctx.lineTo(1500, I.y - 50);
      ctx.moveTo(440, I.y + 50);
      ctx.lineTo(1500, I.y + 50);
      ctx.stroke();
      ctx.setLineDash([]);

      // 路名牌（綠底）和單行道標誌（藍底），立在轉角
      if (!I.passed) {
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        rr(444, I.y + 155, 52, 16, 3);
        ctx.fillStyle = "#2e7d32";
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = font(10.5, "bold");
        ctx.fillText(I.name, 470, I.y + 163.5);
        rr(444, I.y + 173, 52, 15, 3);
        ctx.fillStyle = "#1565c0";
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = font(10, "bold");
        ctx.fillText(I.crossDir === 1 ? "單行 →" : "← 單行", 470, I.y + 181);
      }
    }

    // 台灣的紅綠燈是橫的（紅、黃、綠），旁邊還有倒數秒數
    function drawSignalHead(cx, cy, I, scale, countdownLeft) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#151515";
      rr(-25, -9, 50, 18, 4); ctx.fill();
      const lamps = [["red", -15, "#ff1744", "#3a1212"], ["yellow", 0, "#ffd600", "#3a3512"], ["green", 15, "#00e676", "#123a1f"]];
      for (const [name, dx, on, off] of lamps) {
        const lit = I.light === name;
        ctx.fillStyle = lit ? on : off;
        if (lit) {
          ctx.shadowColor = on;
          ctx.shadowBlur = 18;
        }
        circle(dx, 0, 5.5);
        ctx.shadowBlur = 0;
      }
      // 倒數秒數（可以放在燈的左邊或右邊）
      const bx = countdownLeft ? -49 : 27;
      ctx.fillStyle = "#0b0b0b";
      rr(bx, -9, 22, 18, 3); ctx.fill();
      ctx.fillStyle = I.light === "green" ? "#00e676" : (I.light === "yellow" ? "#ffd600" : "#ff1744");
      ctx.font = font(12, "bold");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(Math.min(99, Math.ceil(I.lightTimer / 60))), bx + 11, 1);
      ctx.restore();
    }

    // 紅綠燈（畫在最上層）
    function drawTrafficLights(I) {
      ctx.strokeStyle = "#5f6368";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";

      // 1. 路口「對面」的燈：從轉角伸到馬路上空，面對等紅燈的你
      const far = I.y - 170;
      line(436, far, 300, far);
      line(64, far, 150, far);
      ctx.fillStyle = "#3c4043";
      circle(436, far, 6);
      circle(64, far, 6);
      drawSignalHead(300, far, I, 1, false);
      drawSignalHead(150, far, I, 0.85, false);

      // 2. 路口「這一側」的燈：立在兩邊路緣、對齊停等區前緣（車頭超過這裡就是闖紅燈）
      const near = I.y + STOP_LINE;
      line(438, near, 404, near);
      line(62, near, 96, near);
      ctx.fillStyle = "#3c4043";
      circle(438, near, 6);
      circle(62, near, 6);
      drawSignalHead(392, near, I, 0.85, false);
      drawSignalHead(108, near, I, 0.85, true);
    }

    // ===== 轉彎提示 =====

    // 腳踏車是否已經進入「可以按方向鍵準備轉彎」的範圍
    function inTurnRange(I) {
      const turnPointY = I.y + 100 + TURN_RADIUS;
      return turnPointY < player.y && turnPointY > player.y - 450;
    }

    // 路面上的轉彎指引：要轉的車道塗黃色，畫上轉彎箭頭（跟真實的路面指向線一樣）
    function drawRouteGuide(I) {
      if (!I.isRoute || I.handled) return;
      const x = lanes[I.crossDir === 1 ? 2 : 0];
      const pulse = 0.2 + Math.sin(frameCount * 0.1) * 0.07;
      ctx.fillStyle = "rgba(255,213,79," + pulse + ")";
      ctx.fillRect(x - 46, I.y + WAIT_BOX_END + 8, 92, 520);
      for (let y = I.y + 350; y < I.y + 800; y += 150) {
        drawTurnArrow(x, y, I.crossDir, "rgba(255,255,255,0.9)", 1);
      }
    }

    // 畫面上方的大橫幅：快到要轉彎的路口時出現
    function drawTurnBanner() {
      if (turning) return;
      const seg = currentSeg();
      if (!seg.turn) return;
      const distLeft = seg.length - segDistance;
      if (distLeft > 3000) return;               // 300m 內才出現

      const I = intersection;
      const routeI = I && I.isRoute && !I.handled ? I : null;
      if (I && I.isRoute && I.handled) return;   // 剛錯過路口 → 先不顯示

      const dirText = seg.turn === 1 ? "右轉" : "左轉";
      const nextStreet = dest.route[segIndex + 1].street;
      const targetLane = seg.turn === 1 ? 2 : 0;
      const blink = Math.floor(frameCount / 15) % 2 === 0;

      // 這一刻該做什麼
      let hint, hintColor;
      if (turnQueued === seg.turn) {
        hint = "✅ 已準備" + dirText + "，繼續騎";
        hintColor = "#69f0ae";
      } else if (player.lane !== targetLane) {
        hint = "👉 先切到" + (seg.turn === 1 ? "最右" : "最左") + "車道";
        hintColor = blink ? "#ffd740" : "#fff";
      } else if (routeI && inTurnRange(routeI)) {
        hint = "按 " + (seg.turn === 1 ? "→" : "←") + " 準備轉彎";
        hintColor = blink ? "#ffd740" : "#fff";
      } else {
        hint = "還有 " + Math.round(distLeft / 10) + " m";
        hintColor = "#fff";
      }

      // 橫幅放在上方資訊列的正下方，才不會擋到前面的路和紅綠燈
      const g = ctx.createLinearGradient(0, 98, 0, 152);
      g.addColorStop(0, "rgba(21,101,192,0.95)");
      g.addColorStop(1, "rgba(13,71,161,0.95)");
      rr(96, 98, 258, 54, 12);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = "#ffd740";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      drawTurnArrow(128, 128, seg.turn, "#ffd740", 0.78);

      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.font = font(18, "bold");
      ctx.fillText("前方" + dirText + " " + nextStreet, 158, 115);
      ctx.fillStyle = hintColor;
      ctx.font = font(14, "bold");
      ctx.fillText(hint, 158, 138);
    }

    // ===== 校門：最後一段路快騎完時出現，騎到就抵達 =====
    function updateGate() {
      const seg = currentSeg();
      if (!seg.turn && !gate && segDistance >= seg.length - 620) {
        gate = { y: -100 };
      }
      if (gate) {
        gate.y = gate.y + speed;
        if (gate.y >= player.y - 30 && !gameOver) {
          won = true;
          endGame("win");
        }
      }
    }

    function drawGate() {
      if (!gate) return;
      const y = gate.y;
      // 終點格子線
      for (let i = 0; i < 29; i++) {
        for (let r = 0; r < 2; r++) {
          ctx.fillStyle = (i + r) % 2 ? "#fafafa" : "#111";
          ctx.fillRect(105 + i * 10, y + 10 + r * 10, 10, 10);
        }
      }
      // 門柱（紅磚）
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      rr(80, y - 22, 26, 42, 4); ctx.fill();
      rr(402, y - 22, 26, 42, 4); ctx.fill();
      ctx.fillStyle = "#8d3b2a";
      rr(76, y - 26, 26, 42, 4); ctx.fill();
      rr(398, y - 26, 26, 42, 4); ctx.fill();
      ctx.fillStyle = "#b5523c";
      rr(79, y - 23, 20, 8, 2); ctx.fill();
      rr(401, y - 23, 20, 8, 2); ctx.fill();
      // 門楣
      rr(84, y - 50, 332, 32, 8);
      ctx.fillStyle = "#7b1f1f";
      ctx.fill();
      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#ffe082";
      ctx.font = font(16, "900");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("國立成功大學　" + dest.campus, 250, y - 33);
    }

    // ===== 第 6 步：碰撞判定、扣命、計分 =====

    let lives = 3;            // 剩幾條命
    let invincibleTimer = 0;  // 無敵時間（幀數），撞到後一段時間不會再扣命
    let shakeTimer = 0;       // 畫面震動時間
    let message = "";         // 畫面中間要顯示的訊息
    let messageTimer = 0;     // 訊息還要顯示幾幀
    let gameOver = false;     // 遊戲是否結束
    let gameOverReason = "";  // 怎麼結束的：win / normal / redlight
    let lastHitMsg = "";      // 最後一次被什麼撞（結束畫面用）
    let resultFrame = 0;      // 結束畫面播了幾幀（做動畫用）
    let result = null;        // 結算資料

    // 這一局的表現
    const stats = { distance: 0, nearMiss: 0, perfectStop: 0, bell: 0 };

    // 騎車中即時顯示的分數
    function liveScore() {
      return Math.floor(stats.distance / 10) + stats.nearMiss * 50 + stats.perfectStop * 100 + stats.bell * 30;
    }

    // 每種障礙物的碰撞範圍（中心到邊緣的距離）
    function hitBox(o) {
      if (o.type === "pothole") return { w: 16, h: 12 };   // 很小，要壓到才算
      if (o.type === "parked") return { w: 18, h: 28 };
      if (o.type === "crosser") return { w: o.hitW, h: o.hitH };
      return { w: 26, h: 46 };                               // 直向的機車：窄窄長長的
    }
    function isHit(o) {
      const b = hitBox(o);
      return Math.abs(player.x - o.x) < b.w && Math.abs(player.y - o.y) < b.h;
    }
    // 「差一點就撞到」的範圍
    function isClose(o) {
      const b = hitBox(o);
      return Math.abs(player.x - o.x) < b.w + 24 && Math.abs(player.y - o.y) < b.h + 16;
    }

    // 每一幀檢查所有障礙物
    function checkCollisions() {
      if (gameOver) return;

      // 闖紅燈的懲罰車：無敵時間也躲不掉
      for (const o of obstacles) {
        if (o.fatal && isHit(o)) {
          onHit(o);
          return;
        }
      }

      if (invincibleTimer > 0) {
        invincibleTimer = invincibleTimer - 1;  // 無敵中：只倒數，不檢查
        return;
      }

      for (const o of obstacles) {
        const isVehicle = o.type !== "pothole" && o.type !== "parked";

        // 你騎很慢 → 機車會看到你、繞過你，不會撞到（坑洞、違停還是會撞）
        if (isVehicle && speed < SAFE_SPEED) {
          if (isHit(o) && !o.avoided) {
            o.avoided = true;
            message = "😮 機車繞過你了（騎慢比較安全）";
            messageTimer = 60;
          }
          continue;
        }

        if (isHit(o)) {
          onHit(o);
          break;  // 一次只算撞到一個
        }

        // 驚險閃過：曾經靠得很近、又沒撞到 → 加分
        if (isVehicle) {
          if (isClose(o)) {
            o.wasClose = true;
          } else if (o.wasClose && !o.nearMissed && !o.hitPlayer) {
            o.nearMissed = true;
            stats.nearMiss++;
            addPopup("好險！+50", player.x, player.y - 46, "#ffd740");
            Sound.whoosh();
          }
        }
      }
    }

    // 撞到之後會發生的事（o = 撞到的那個障礙物）
    function onHit(o) {
      o.hitPlayer = true;
      shakeTimer = 15;
      hitFlash = 18;

      // 闖紅燈被撞：直接死亡
      if (o.fatal) {
        lives = 0;
        burst(player.x, player.y, ["#ffd54f", "#ff7043", "#ffffff", "#90a4ae"], 30, 5);
        Sound.crash();
        endGame("redlight");
        return;
      }

      lives = lives - 1;
      speed = speed * 0.4;     // 撞到東西，車速驟降
      invincibleTimer = 90;    // 1.5 秒無敵
      messageTimer = 70;

      // 依照撞到的東西，顯示不同訊息
      if (o.type === "pothole") {
        message = o.variant === "hole" ? "💥 人行道坑洞，摔車了！" : "💥 地磚翹起來，摔車了！";
      } else if (o.type === "parked") {
        message = "💥 撞到違停在人行道的機車！";
      } else if (o.type === "wrongway") {
