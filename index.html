        message = "🛵 被逆向機車撞了！";
      } else if (o.type === "crosser") {
        message = o.hitMsg;
      } else if (o.phase === "brake") {
        message = "🛵 機車切進來急煞，撞上去了！";
      } else if (o.lane === -1 || o.lane === 3) {
        message = "🛵 被騎人行道的機車撞了！";
      } else {
        message = "🛵 被亂切機車撞了！";
      }
      lastHitMsg = message;

      if (o.type === "pothole") {
        burst(player.x, player.y - 10, ["#8a4a37", "#c4785d", "#d7ccc8"], 14, 3);
        Sound.thud();
      } else {
        burst(player.x, player.y - 10, ["#ffd54f", "#ff7043", "#ffffff", "#90a4ae", o.color || "#ffffff"], 22, 4.5);
        Sound.crash();
      }

      if (lives <= 0) {
        endGame("normal");
      }
    }

    // ===== 按鈴：叮叮！讓想切進來、逆向的機車讓開 =====
    let bellCooldown = 0;

    function ringBell() {
      if (bellCooldown > 0) return;
      bellCooldown = 40;
      Sound.bell();
      addPopup("叮叮！", player.x + 34, player.y - 30, "#fff59d");

      for (const o of obstacles) {
        if (o.warned) continue;
        const ahead = player.y - o.y;   // 正數 = 在你前面
        if (o.type === "swerver" && (o.phase === "overtake" || o.phase === "cutin") && Math.abs(ahead) < 240) {
          o.warned = true;
          if (Math.random() < 0.75) {   // 大部分騎士聽到會讓（不是每個都會）
            if (o.phase === "cutin") o.lane = o.fromLane;
            o.phase = "leave";
            o.targetSpeed = 8;
            stats.bell++;
            addPopup("🔔 對方讓開了 +30", o.x, o.y - 40, "#69f0ae");
          }
        } else if (o.type === "wrongway" && ahead > 0 && ahead < 320 && Math.abs(o.x - player.x) < 60) {
          o.warned = true;
          if (Math.random() < 0.75) {
            const choices = [o.lane - 1, o.lane + 1].filter(l => l >= 0 && l <= 2 && Math.abs(laneX(l) - player.x) >= 60);
            if (choices.length > 0) {
              o.lane = pick(choices);
              stats.bell++;
              addPopup("🔔 對方閃開了 +30", o.x, o.y + 40, "#69f0ae");
            }
          }
        }
      }
    }

    // ===== 結束：抵達、命用完、闖紅燈 =====

    // 最佳紀錄（每個目的地各存一筆）
    function loadRecords() {
      try {
        return JSON.parse(storeGet("tainanBikeRecords") || "{}");
      } catch (e) {
        return {};
      }
    }
    function saveRecord(index, score, stars) {
      const records = loadRecords();
      const old = records[index];
      let isNew = false;
      if (!old || score > old.score) {
        records[index] = { score: score, stars: Math.max(stars, old ? old.stars : 0) };
        isNew = true;
      } else if (stars > old.stars) {
        records[index].stars = stars;
      }
      storeSet("tainanBikeRecords", JSON.stringify(records));
      return isNew;
    }

    function endGame(reason) {
      Board.flush();   // 結束時把遊玩時間上傳
      gameOver = true;
      gameOverReason = reason;
      resultFrame = 0;
      Music.stop();
      for (const k in keys) keys[k] = false;

      const meters = Math.floor(stats.distance / 10);
      if (reason === "win") {
        const usedSec = elapsedFrames / 60;
        const limit = timeLimit(dest);
        const late = usedSec > limit;
        const timeLeft = late ? 0 : Math.floor(limit - usedSec);
        const rows = [
          ["🚲 騎乘距離", meters + " m", meters],
          ["😮 好險閃避", "× " + stats.nearMiss, stats.nearMiss * 50],
          ["🚦 紅燈完美停車", "× " + stats.perfectStop, stats.perfectStop * 100],
          ["🔔 按鈴示警", "× " + stats.bell, stats.bell * 30],
          ["⏰ 剩餘時間", late ? "遲到" : timeLeft + " 秒", timeLeft * 10],
          ["❤️ 剩餘生命", "× " + lives, lives * 200]
        ];
        const total = rows.reduce((sum, r) => sum + r[2], 0);
        const stars = Math.max(1, lives - (late ? 1 : 0));   // 剩幾條命就幾顆星，遲到扣一顆
        const isNew = saveRecord(DESTINATIONS.indexOf(dest), total, stars);
        result = { rows: rows, total: total, stars: stars, late: late, usedSec: usedSec, limit: limit, isNew: isNew, rankText: "" };
        Sound.fanfare();
        spawnConfetti();

        // 最難的兩關（力行、歸仁）：分數上傳排行榜
        const level = RANKED[DESTINATIONS.indexOf(dest)];
        if (level && Board.name) Board.submitScore(level, total, result);
      } else {
        const left = Math.round((1 - routeProgress()) * totalLength(dest) / 10);
        result = { meters: meters, left: left, score: liveScore(), tip: pick(TIPS) };
        if (reason === "redlight") Sound.siren();
        else Sound.fail();
      }
    }

    const TIPS = [
      "看到機車「切進來」就煞車，或按 🔔 讓它讓開",
      "畫面底部出現「後方來車」時，先別換車道",
      "時速低於 8 km/h 時機車會繞過你（🛡️）",
      "紅燈時停進機車停等區、車頭靠近白線，有「完美停車」加分",
      "人行道上的坑洞很小，樹蔭下更要小心",
      "聽到「吱——」的煞車聲，代表前面有人急煞"
    ];

    // 倒數各種計時器
    function updateEffects() {
      if (shakeTimer > 0) shakeTimer--;
      if (messageTimer > 0) messageTimer--;
      if (bellCooldown > 0) bellCooldown--;
    }

    // ===== 畫面上方的資訊（HUD）=====

    // 按鈕的位置（畫按鈕和判斷有沒有點到都用這些數字）
    const HOME_BUTTON = { x: 8, y: 8, w: 46, h: 28 };
    const SOUND_BUTTON = { x: 8, y: 40, w: 46, h: 28 };
    const MENU_HELP_BUTTON = { x: 8, y: 8, w: 72, h: 28 };
    const MENU_SOUND_BUTTON = { x: 446, y: 8, w: 46, h: 28 };
    const MENU_BOARD_BUTTON = { x: 8, y: 42, w: 72, h: 26 };
    const PAUSE_MENU_BUTTON = { x: 70, y: 330, w: 170, h: 60 };
    const PAUSE_RESUME_BUTTON = { x: 260, y: 330, w: 170, h: 60 };

    // 點擊位置 (x, y) 有沒有在按鈕範圍內（多給 4 點容錯，手指比較好按）
    function inButton(b, x, y) {
      return x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4;
    }

    // 半透明的深色面板
    function panel(x, y, w, h) {
      rr(x, y, w, h, 10);
      ctx.fillStyle = "rgba(14,20,28,0.78)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawButton(b, text, color, fontSize) {
      rr(b.x, b.y, b.w, b.h, 10);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = font(fontSize, "bold");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }

    function drawIconButton(b, icon) {
      rr(b.x, b.y, b.w, b.h, 8);
      ctx.fillStyle = "rgba(14,20,28,0.78)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.font = font(15);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.fillText(icon, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }

    function drawHomeButton() {
      drawIconButton(HOME_BUTTON, "🏠");
    }
    function soundIcon() {
      return Sound.muted ? "🔇" : "🔊";
    }

    function drawHeart(x, y, s, filled) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s / 8, s / 8);
      ctx.fillStyle = filled ? "#ff5252" : "rgba(255,255,255,0.16)";
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-9, 0, -6, -8, 0, -3);
      ctx.bezierCurveTo(6, -8, 9, 0, 0, 6);
      ctx.fill();
      ctx.restore();
    }

    function drawHUD() {
      // 左上：選單、音效按鈕
      drawHomeButton();
      drawIconButton(SOUND_BUTTON, soundIcon());

      // 時速表（圓弧儀表）
      panel(60, 8, 80, 62);
      const kmh = Math.round(speed * 4);   // 換算成看起來合理的時速
      const cx = 100, cy = 38, r = 21;
      const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
      ctx.lineCap = "round";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      const gaugeColor = speed < SAFE_SPEED ? "#64b5f6" : (speed > 7 ? "#ff5252" : "#69f0ae");
      ctx.strokeStyle = gaugeColor;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * (speed / MAX_SPEED) + 0.001); ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = font(17, "900");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(kmh), cx, cy);
      ctx.fillStyle = "#b0bec5";
      ctx.font = font(9, "bold");
      ctx.fillText("km/h", cx, 61);
      if (speed < SAFE_SPEED) {
        ctx.font = font(11);
        ctx.fillText("🛡️", 129, 19);
      }

      // 中間：路名、分數、導航、路線進度
      panel(146, 8, 206, 62);
      ctx.textAlign = "left";
      ctx.fillStyle = "#fff";
      ctx.font = font(14, "bold");
      ctx.fillText("📍 " + currentStreet, 155, 23);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffd740";
      ctx.font = font(13, "bold");
      ctx.fillText("⭐ " + liveScore().toLocaleString(), 344, 23);

      const seg = currentSeg();
      const metersLeft = Math.max(0, Math.round((seg.length - segDistance) / 10));
      ctx.textAlign = "left";
      ctx.fillStyle = "#80d8ff";
      ctx.font = font(12, "bold");
      if (seg.turn) {
        ctx.fillText("🧭 " + metersLeft + "m 後" + (seg.turn === 1 ? "右轉 " : "左轉 ") + dest.route[segIndex + 1].street, 155, 42);
      } else {
        ctx.fillText("🎯 " + dest.campus + " 剩 " + metersLeft + "m", 155, 42);
      }
      drawProgressBar(156, 56, 188);

      // 易肇事路段警告
      if (seg.warning) {
        rr(146, 74, 206, 18, 9);
        ctx.fillStyle = Math.floor(frameCount / 20) % 2 ? "rgba(230,81,0,0.9)" : "rgba(191,54,12,0.9)";
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = font(11, "bold");
        ctx.textAlign = "center";
        ctx.fillText("⚠ 你正騎在「" + seg.warning + "」", 249, 83.5);
      }

      // 右上：命、上課倒數
      panel(358, 8, 134, 62);
      for (let i = 0; i < 3; i++) drawHeart(380 + i * 22, 24, 9, i < lives);
      const remain = timeLimit(dest) - elapsedFrames / 60;
      ctx.textAlign = "right";
      ctx.font = font(18, "900");
      if (remain >= 0) {
        ctx.fillStyle = remain < 15 && Math.floor(frameCount / 15) % 2 ? "#ff5252" : (remain < 15 ? "#ffd740" : "#fff");
        ctx.fillText("⏰ " + formatTime(remain), 484, 51);
      } else {
        ctx.fillStyle = "#ff5252";
        ctx.fillText("遲到 " + formatTime(-remain), 484, 51);
      }

      // 前方路口的燈號和轉彎提示
      const I = intersection;
      if (I && !I.passed && !I.passedStopLine) {
        const lightText = { red: "紅燈", yellow: "黃燈", green: "綠燈" };
        const lightColor = { red: "#ff1744", yellow: "#ffd600", green: "#00e676" };
        const h = I.hotspot ? 70 : 52;
        panel(358, 74, 134, h);
        ctx.save();
        ctx.shadowColor = lightColor[I.light];
        ctx.shadowBlur = 12;
        ctx.fillStyle = lightColor[I.light];
        circle(374, 90, 7);
        ctx.restore();
        ctx.textAlign = "left";
        ctx.fillStyle = lightColor[I.light];
        ctx.font = font(14, "bold");
        ctx.fillText(lightText[I.light] + " " + Math.ceil(I.lightTimer / 60) + " 秒", 388, 90);
        ctx.fillStyle = "#fff";
        ctx.font = font(11.5);
        if (!I.isRoute) ctx.fillText("🧭 這個路口直走", 366, 112);
        else if (I.crossDir === 1) ctx.fillText("最右車道按 → 右轉", 366, 112);
        else ctx.fillText("最左車道按 ← 左轉", 366, 112);
        if (I.hotspot) {
          ctx.fillStyle = "#ff8a80";
          ctx.font = font(11.5, "bold");
          ctx.fillText("⚠️ 事故熱點路口", 366, 132);
        }
      }
    }

    // 路線進度條：轉彎點、事故熱點、終點旗子
    function drawProgressBar(x, y, w) {
      const total = totalLength(dest);
      rr(x, y - 2.5, w, 5, 2.5);
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fill();
      const p = routeProgress();
      if (p > 0) {
        rr(x, y - 2.5, Math.max(5, w * p), 5, 2.5);
        ctx.fillStyle = "#69f0ae";
        ctx.fill();
      }
      let acc = 0;
      for (let i = 0; i < dest.route.length - 1; i++) {
        acc += dest.route[i].length;
        const mx = x + w * acc / total;
        ctx.fillStyle = dest.route[i].hotspot ? "#ff5252" : "#40c4ff";
        circle(mx, y, 3.5);
      }
      ctx.fillStyle = "#fff";
      circle(x + w * p, y, 3.5);
      ctx.font = font(10);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🏁", x + w + 2, y - 3);
    }

    // 畫面中間的訊息（圓角膠囊）
    function drawMessage() {
      if (messageTimer <= 0) return;
      ctx.font = font(18, "bold");
      const w = Math.min(470, ctx.measureText(message).width + 40);
      const alpha = Math.min(1, messageTimer / 15);
      ctx.globalAlpha = alpha;
      rr(250 - w / 2, 244, w, 44, 22);
      ctx.fillStyle = "rgba(10,14,20,0.82)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(message, 250, 267);
      ctx.globalAlpha = 1;
    }

    // 速度線：騎很快時畫面兩側出現風切線
    function drawSpeedLines() {
      if (speed < 6.5 || turning) return;
      const strength = (speed - 6.5) / 3.5;
      ctx.strokeStyle = "rgba(255,255,255," + (0.08 + strength * 0.25) + ")";
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 14; i++) {
        const x = i < 7 ? 6 + ((i * 37) % 90) : 404 + ((i * 41) % 90);
        const y = ((i * 97 + frameCount * speed * 3) % 760) - 80;
        line(x, y, x, y + 30 + speed * 5);
      }
    }

    // 暈影、晨光、受傷時的紅光
    function drawScreenFx() {
      const sun = ctx.createLinearGradient(500, 0, 200, 300);
      sun.addColorStop(0, "rgba(255,196,120,0.12)");
      sun.addColorStop(1, "rgba(255,196,120,0)");
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, W, H);

      const v = ctx.createRadialGradient(250, 330, 230, 250, 330, 480);
      v.addColorStop(0, "rgba(0,0,0,0)");
      v.addColorStop(1, "rgba(0,0,0,0.38)");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);

      if (hitFlash > 0) {
        ctx.fillStyle = "rgba(255,30,30," + (hitFlash / 18 * 0.35) + ")";
        ctx.fillRect(0, 0, W, H);
      }
    }

    // ===== 畫出整個遊戲畫面 =====
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 遊戲世界（撞到時會震動，轉彎時會旋轉）
      ctx.save();
      if (shakeTimer > 0) {
        ctx.translate(randomBetween(-6, 6), randomBetween(-6, 6));
      }
      if (turning) {
        // 攝影機：以腳踏車為中心，把世界反方向轉 → 腳踏車看起來一直朝上
        ctx.translate(turning.anchorX, 520);
        ctx.rotate(-turning.dir * turning.phi);
        ctx.translate(-player.x, -player.y);
      }
      drawRoad();
      if (intersection) {
        drawIntersection(intersection);
        drawRouteGuide(intersection);
      }
      drawSceneryGround();
      drawSkids();
      drawGroundObstacles();
      drawGate();
      drawVehicles();
      drawPlayer();
      drawParticles();
      drawSceneryOverhead();
      if (intersection && !intersection.passed) {
        drawTrafficLights(intersection);
      }
      drawTags();
      drawPopups();
      drawRearWarnings();
      ctx.restore();

      // 介面（不跟著震動和旋轉）
      drawSpeedLines();
      drawScreenFx();
      if (!gameOver) {
        drawHUD();
        drawTurnBanner();
        if (!paused) drawMessage();
      } else {
        drawGameOver();
      }
    }

    // ===== 結束畫面 =====
    function drawGameOver() {
      const f = resultFrame;
      ctx.fillStyle = "rgba(5,8,12," + Math.min(0.72, f / 20) + ")";
      ctx.fillRect(0, 0, W, H);

      // 中間的卡片（從下面滑上來）
      const slide = Math.max(0, 40 - f * 3);
      ctx.save();
      ctx.translate(0, slide);
      const g = ctx.createLinearGradient(0, 64, 0, 534);
      g.addColorStop(0, "rgba(24,34,46,0.97)");
      g.addColorStop(1, "rgba(12,18,26,0.97)");
      rr(40, 64, 420, 470, 20);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (gameOverReason === "win") {
        drawWinCard(f);
      } else if (gameOverReason === "redlight") {
        drawRedLightCard(f);
      } else {
        drawFailCard(f);
      }
      ctx.restore();

      drawConfetti();

      // 下方提示（播一下才讓你跳過，免得不小心按掉）
      if (f > 30) {
        ctx.globalAlpha = 0.6 + Math.sin(frameCount * 0.1) * 0.4;
        ctx.fillStyle = "#fff";
        ctx.font = font(16, "bold");
        ctx.textAlign = "center";
        ctx.fillText(isTouch() ? "點一下畫面 回到選單" : "按 空白鍵 回到選單", 250, 566);
        ctx.globalAlpha = 1;
      }
    }

    function drawWinCard(f) {
      const R = result;
      ctx.font = font(48);
      ctx.fillText("🎓", 250, 112);
      ctx.fillStyle = "#69f0ae";
      ctx.font = font(28, "900");
      ctx.fillText("抵達" + dest.campus + "！", 250, 162);
      ctx.fillStyle = "#b0bec5";
      ctx.font = font(15);
      ctx.fillText(dest.building + "　花了 " + formatTime(R.usedSec) + "（時限 " + formatTime(R.limit) + "）", 250, 192);
      ctx.font = font(18, "bold");
      if (R.late) {
        ctx.fillStyle = "#ffd740";
        ctx.fillText("⏰ 遲到 " + formatTime(R.usedSec - R.limit) + "　下次早點出門！", 250, 224);
      } else {
        ctx.fillStyle = "#69f0ae";
        ctx.fillText("✅ 準時上課！", 250, 224);
      }

      // 分數明細：一行一行出現
      for (let i = 0; i < R.rows.length; i++) {
        if (f < 20 + i * 10) break;
        const y = 262 + i * 26;
        const [label, detail, pts] = R.rows[i];
        ctx.textAlign = "left";
        ctx.fillStyle = "#eceff1";
        ctx.font = font(14);
        ctx.fillText(label, 76, y);
        ctx.fillStyle = "#90a4ae";
        ctx.fillText(detail, 230, y);
        ctx.textAlign = "right";
        ctx.fillStyle = pts > 0 ? "#ffd740" : "#607d8b";
        ctx.font = font(14, "bold");
        ctx.fillText("+" + pts.toLocaleString(), 424, y);
      }

      // 總分（數字往上跳）
      if (f >= 82) {
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1;
        line(76, 418, 424, 418);
        const shown = Math.round(R.total * clamp((f - 82) / 40, 0, 1));
        ctx.textAlign = "left";
        ctx.fillStyle = "#fff";
        ctx.font = font(16, "bold");
        ctx.fillText("總分", 76, 444);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffd740";
        ctx.font = font(30, "900");
        ctx.fillText(shown.toLocaleString(), 424, 444);
      }

      // 星星一顆一顆跳出來
      ctx.textAlign = "center";
      for (let i = 0; i < 3; i++) {
        const t = f - (128 + i * 10);
        if (t < 0) continue;
        const s = t < 8 ? 0.6 + t / 8 * 0.7 : 1.3 - Math.min(0.3, (t - 8) / 20);
        ctx.save();
        ctx.translate(210 + i * 40, 484);
        ctx.scale(s, s);
        ctx.fillStyle = i < R.stars ? "#ffd740" : "rgba(255,255,255,0.18)";
        ctx.font = font(32);
        ctx.fillText("★", 0, 0);
        ctx.restore();
      }
      if (f > 165) {
        const lines = [];
        if (R.isNew) lines.push(["🎊 個人新紀錄！", Math.floor(frameCount / 10) % 2 ? "#ff5252" : "#ffd740", font(14, "900")]);
        if (R.rankText) lines.push([R.rankText, "#80d8ff", font(13, "bold")]);
        lines.forEach(([text, color, f2], i) => {
          ctx.fillStyle = color;
          ctx.font = f2;
          ctx.fillText(text, 250, lines.length === 2 ? 507 + i * 19 : 516);
        });
      }
    }

    function drawRedLightCard(f) {
      // 救護車的紅藍燈
      const flash = Math.floor(frameCount / 8) % 2;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = flash ? "#ff1744" : "#2979ff";
      circle(100, 120, 60);
      ctx.fillStyle = flash ? "#2979ff" : "#ff1744";
      circle(400, 120, 60);
      ctx.restore();

      const x = Math.max(250, 560 - f * 9);
      ctx.font = font(64);
      ctx.fillText("🚑", x, 140);
      ctx.fillStyle = "#ff5252";
      ctx.font = font(34, "900");
      ctx.fillText("闖紅燈被撞了", 250, 220);
      ctx.fillStyle = "#fff";
      ctx.font = font(20, "bold");
      ctx.fillText("🏥 已送往成大醫院", 250, 268);
      ctx.fillStyle = "#cfd8dc";
      ctx.font = font(15);
      ctx.fillText("紅燈時車頭不要超過停等區的白線，生命只有一條", 250, 312);
      ctx.fillStyle = "#90a4ae";
      ctx.font = font(14);
      ctx.fillText("騎了 " + result.meters + " m，離" + dest.campus + "還有 " + result.left + " m", 250, 362);
      ctx.fillStyle = "#ffd740";
      ctx.font = font(18, "bold");
      ctx.fillText("得分 ⭐ " + result.score.toLocaleString(), 250, 404);
      ctx.fillStyle = "#80d8ff";
      ctx.font = font(13);
      ctx.fillText("💡 " + result.tip, 250, 470);
    }

    function drawFailCard(f) {
      const s = f < 10 ? 0.5 + f / 10 * 0.6 : 1.1 - Math.min(0.1, (f - 10) / 30);
      ctx.save();
      ctx.translate(250, 130);
      ctx.scale(s, s);
      ctx.font = font(56);
      ctx.fillText("💥", 0, 0);
      ctx.restore();
      ctx.fillStyle = "#ff5252";
      ctx.font = font(40, "900");
      ctx.fillText("GAME OVER", 250, 210);
      ctx.fillStyle = "#fff";
      ctx.font = font(17, "bold");
      ctx.fillText(lastHitMsg || "台南的路太可怕了…", 250, 258);
      ctx.fillStyle = "#cfd8dc";
      ctx.font = font(15);
      ctx.fillText("台南的路太可怕了…今天只好請假了", 250, 292);
      ctx.fillStyle = "#90a4ae";
      ctx.font = font(14);
      ctx.fillText("騎了 " + result.meters + " m，離" + dest.campus + "還有 " + result.left + " m", 250, 346);
      ctx.fillStyle = "#ffd740";
      ctx.font = font(18, "bold");
      ctx.fillText("得分 ⭐ " + result.score.toLocaleString(), 250, 390);
      ctx.fillStyle = "#80d8ff";
      ctx.font = font(13);
      ctx.fillText("💡 " + result.tip, 250, 470);
    }

    // ===== 選目的地的畫面 =====
    const DIFF_COLORS = ["#66bb6a", "#9ccc65", "#ffca28", "#ffa726", "#ef5350"];

    function drawMenu() {
      // 背景：慢慢捲動的台南街道
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      drawRoad();
      drawSceneryGround();
      drawSceneryOverhead();
      ctx.restore();
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "rgba(8,14,22,0.8)");
      bg.addColorStop(1, "rgba(8,14,22,0.9)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 標題：旁邊有一台一直踩的腳踏車
      ctx.save();
      ctx.translate(136, 40);
      ctx.rotate(Math.PI / 2);
      ctx.scale(0.62, 0.62);
      drawBikeSprite(frameCount * 0.25, false);
      ctx.restore();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.font = font(30, "900");
      ctx.fillText("台南騎車生存記", 282, 40);
      ctx.fillStyle = "#fff";
      ctx.fillText("台南騎車生存記", 280, 38);
      ctx.fillStyle = "#b0bec5";
      ctx.font = font(13);
      ctx.fillText("從台南火車站出發，平安又準時地去成大上課！", 250, 70);

      drawButton(MENU_HELP_BUTTON, "❓ 玩法", "rgba(14,20,28,0.85)", 13);
      drawButton(MENU_BOARD_BUTTON, "🏆 排行", "rgba(120,80,0,0.9)", 13);
      drawIconButton(MENU_SOUND_BUTTON, soundIcon());

      // 玩家名字
      if (Board.name) {
        ctx.textAlign = "right";
        ctx.fillStyle = "#cfd8dc";
        ctx.font = font(11, "bold");
        ctx.fillText("👤 " + Board.name, 492, 54);
      }

      // 每個目的地一張卡片
      const records = loadRecords();
      for (let i = 0; i < DESTINATIONS.length; i++) {
        const d = DESTINATIONS[i];
        const top = 92 + i * 66;
        const selected = i === menuIndex;

        rr(20, top, 460, 60, 12);
        if (selected) {
          const g = ctx.createLinearGradient(20, 0, 480, 0);
          g.addColorStop(0, "rgba(27,94,32,0.95)");
          g.addColorStop(1, "rgba(46,125,50,0.9)");
          ctx.fillStyle = g;
          ctx.fill();
          ctx.save();
          ctx.shadowColor = "#69f0ae";
          ctx.shadowBlur = 12;
          ctx.strokeStyle = "#69f0ae";
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        } else {
          ctx.fillStyle = "rgba(28,40,54,0.9)";
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.08)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // 難度色條
        rr(28, top + 9, 5, 42, 2.5);
        ctx.fillStyle = DIFF_COLORS[d.stars - 1];
        ctx.fill();

        // 第一行：校區・系館、難度星星
        ctx.textAlign = "left";
        ctx.fillStyle = "#fff";
        ctx.font = font(16, "bold");
        ctx.fillText((RANKED[i] ? "🏆 " : "") + d.campus + "・" + d.building, 42, top + 16);
        ctx.textAlign = "right";
        ctx.font = font(14);
        ctx.fillStyle = "#ffd740";
        const filled = "★".repeat(d.stars);
        const empty = "★".repeat(5 - d.stars);
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        ctx.fillText(empty, 466, top + 16);
        ctx.fillStyle = "#ffd740";
        ctx.fillText(filled, 466 - ctx.measureText(empty).width, top + 16);

        // 第二行：路線
        ctx.textAlign = "left";
        ctx.fillStyle = "#cfd8dc";
        ctx.font = font(11.5);
        ctx.fillText(d.route.map(s => s.street).join(" → "), 42, top + 35);

        // 第三行：距離、時限、熱點數；右邊是最佳紀錄
        const hotspots = d.route.filter(s => s.hotspot).length;
        ctx.fillStyle = "#90a4ae";
        ctx.font = font(11);
        ctx.fillText("路程 " + Math.round(totalLength(d) / 10) + " m｜時限 " + formatTime(timeLimit(d)) +
                     "｜熱點 " + hotspots + " 處", 42, top + 51);
        const rec = records[i];
        if (rec) {
          ctx.textAlign = "right";
          ctx.fillStyle = "#ffd740";
          ctx.font = font(11.5, "bold");
          ctx.fillText("🏅 " + "★".repeat(rec.stars) + " " + rec.score.toLocaleString() + " 分", 466, top + 51);
        }
      }

      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = font(14, "bold");
      if (isTouch()) {
        ctx.fillText("👆 點目的地出發", 250, 572);
      } else {
        ctx.fillText("↑↓ 選擇　空白鍵 出發　H 玩法　L 排行榜　M 音效", 250, 572);
      }
    }

    // ===== 玩法說明 =====

    let inHelp = false;         // 是否在玩法說明畫面
    let helpNext = "menu";      // 看完說明要去哪：menu = 回選單、intro = 播開場動畫
    let pendingDest = 0;        // 選好、準備出發的目的地

    function helpSeen() {
      return storeGet("tainanBikeHelpSeen") === "1";
    }
    function markHelpSeen() {
      storeSet("tainanBikeHelpSeen", "1");
    }

    function showHelp(next) {
      inMenu = false;
      inHelp = true;
      helpNext = next;
    }

    function closeHelp() {
      inHelp = false;
      markHelpSeen();
      if (helpNext === "intro") {
        beginIntro();
      } else {
        inMenu = true;
      }
    }

    // 選好目的地：第一次玩先看說明，然後播開場動畫
    function requestStart(index) {
      pendingDest = index;
      dest = DESTINATIONS[index];
      Sound.confirm();
      if (!helpSeen()) {
        showHelp("intro");
      } else {
        inMenu = false;
        beginIntro();
      }
    }

    function drawHelp() {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#1b2a38");
      bg.addColorStop(1, "#111a24");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.font = font(26, "900");
      ctx.fillText("📖 玩法說明", 250, 32);

      // 每一項：圖示、標題、說明（說明可以有兩行）
      const items = [
        ["🎯", "目標", ["從台南火車站騎到成大，在上課前平安抵達校門"]],
        ["🎮", "操作", ["↑ 加速　↓ 煞車（按住）　← → 換車道／騎上人行道", "空白鍵、B 鍵或 🔔 按鈴：讓想切進來、逆向的機車讓開"]],
        ["🧭", "轉彎", ["看藍色橫幅 → 切到路面黃色的車道 → 按轉彎方向"]],
        ["🚦", "紅綠燈", ["紅燈停進「機車停等區」，車頭超過紅綠燈那條白線就是闖紅燈"]],
        ["🛵", "小心機車", ["逆向、從後面超車再切進來急煞、巷口衝出、闖紅燈", "注意底部「⚠ 後方來車」，聽到「吱——」要小心"]],
        ["🛡️", "騎慢比較安全", ["時速低於 8 km/h，機車會繞過你，但太慢會遲到"]],
        ["🧱", "人行道", ["有很小的坑洞、翹起的地磚和違停機車，樹蔭下更難看清楚"]],
        ["⭐", "計分", ["驚險閃過機車 +50、紅燈完美停車 +100、按鈴示警 +30", "🏆 力行、歸仁校區的分數和總遊玩時間會上排行榜（L 鍵）"]],
        ["❤️", "命", ["3 條命，撞到扣 1 條；剩幾條命拿幾顆星，遲到扣 1 顆"]]
      ];

      let y = 70;
      for (const [icon, title, lines] of items) {
        ctx.textAlign = "center";
        ctx.font = font(22);
        ctx.fillText(icon, 40, y + 9);

        ctx.textAlign = "left";
        ctx.fillStyle = "#ffd740";
        ctx.font = font(15, "bold");
        ctx.fillText(title, 66, y);

        ctx.fillStyle = "#eceff1";
        ctx.font = font(12.5);
        for (let i = 0; i < lines.length; i++) {
          ctx.fillText(lines[i], 66, y + 19 + i * 17);
        }
        y = y + 31 + lines.length * 17;
      }

      // 下方提示
      ctx.globalAlpha = 0.6 + Math.sin(frameCount * 0.1) * 0.4;
      ctx.textAlign = "center";
      ctx.fillStyle = "#69f0ae";
      ctx.font = font(16, "bold");
      const action = helpNext === "intro" ? "出發！" : "回到選單";
      ctx.fillText((isTouch() ? "點一下畫面 " : "按空白鍵 ") + action, 250, 578);
      ctx.globalAlpha = 1;
    }

    // ===== 開場動畫：睡過頭 → 鬧鐘響 → 要遲到了 → 衝出門 =====

    const INTRO_LENGTH = 400;   // 動畫長度（幀），大約 6.7 秒
    let inIntro = false;
    let introFrame = 0;

    function beginIntro() {
      inIntro = true;
      introFrame = 0;
      Music.stop();
    }

    function endIntro() {
      inIntro = false;
      startGame(pendingDest);
    }

    // 動畫的音效（照時間點播放）
    function introSounds(f) {
      if (f >= 55 && f < 108 && (f - 55) % 14 === 0) Sound.alarm();
      if (f === 81) Sound.gasp();
      if (f === 141) Sound.sting();
      if (f >= 202 && f < 258 && (f - 202) % 9 === 0) Sound.step();
      if (f === 261) Sound.jump();
      if (f === 276) Sound.bell();
      if (f === 290) Sound.whoosh();
    }

    // 鬧鐘上的時間：上課時間 08:10 往前推「這個目的地的時限」
    function introClockText() {
      const t = (8 * 3600 + 10 * 60) - timeLimit(dest);
      const hh = Math.floor(t / 3600);
      const mm = Math.floor((t % 3600) / 60);
      const ss = t % 60;
      return [hh, mm, ss].map(n => String(n).padStart(2, "0")).join(":");
    }

    // 畫一個 emoji，可以左右翻轉（flip）和旋轉（rot）
    function drawEmoji(icon, x, y, size, flip, rot) {
      ctx.save();
      ctx.translate(x, y);
      if (rot) ctx.rotate(rot);
      if (flip) ctx.scale(-1, 1);
      ctx.font = font(size);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(icon, 0, 0);
      ctx.restore();
    }

    // 畫面下方的字幕
    function drawCaption(text, color) {
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 500, 500, 56);
      ctx.fillStyle = color || "#fff";
      ctx.font = font(22, "bold");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 250, 528);
    }

    // 第 1 幕：房間，睡覺 → 鬧鐘響 → 驚醒
    function drawBedroom(f) {
      ctx.fillStyle = "#3e4a6b";
      ctx.fillRect(0, 0, 500, 430);
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(0, 430, 500, 170);
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      for (let x = 0; x < 500; x += 50) ctx.fillRect(x, 430, 2, 170);

      // 窗戶：外面天剛亮
      const sky = ctx.createLinearGradient(0, 90, 0, 210);
      sky.addColorStop(0, "#ffcc80");
      sky.addColorStop(1, "#ff8a65");
      ctx.fillStyle = sky;
      ctx.fillRect(250, 90, 170, 120);
      ctx.fillStyle = "rgba(255,240,200,0.12)";
      ctx.beginPath();
      ctx.moveTo(250, 210); ctx.lineTo(420, 210); ctx.lineTo(470, 430); ctx.lineTo(200, 430);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#d7ccc8";
      ctx.lineWidth = 8;
      ctx.strokeRect(250, 90, 170, 120);
      ctx.fillStyle = "#d7ccc8";
      ctx.fillRect(331, 90, 8, 120);

      // 床：床頭、棉被、枕頭
      ctx.fillStyle = "#6d4c41";
      ctx.fillRect(420, 300, 28, 140);
      ctx.fillStyle = "#5c6bc0";
      ctx.fillRect(170, 360, 255, 75);
      ctx.fillStyle = "#eceff1";
      ellipse(385, 362, 38, 16);

      // 床頭櫃和鬧鐘
      ctx.fillStyle = "#795548";
      ctx.fillRect(40, 370, 100, 65);
      const ringing = f >= 55;
      const shake = ringing ? Math.sin(f * 1.6) * 5 : 0;
      ctx.save();
      ctx.translate(90 + shake, 345);
      ctx.fillStyle = "#212121";
      rr(-42, -22, 84, 44, 6); ctx.fill();
      ctx.fillStyle = "#ff1744";
      ctx.font = "bold 15px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(introClockText(), 0, 1);
      ctx.restore();

      // 鬧鐘響：「鈴鈴鈴！」
      if (ringing && Math.floor(f / 6) % 2 === 0) {
        ctx.fillStyle = "#ffd740";
        ctx.font = font(26, "900");
        ctx.textAlign = "center";
        ctx.fillText("鈴鈴鈴！", 95, 290);
        ctx.font = font(22, "bold");
        ctx.fillText("〰", 25, 330);
        ctx.fillText("〰", 165, 330);
      }

      // 玩家：睡覺 😴 → 驚醒 😳（跳起來一下）
      if (f < 80) {
        drawEmoji("😴", 383, 342, 46);
        ctx.fillStyle = "#fff";
        ctx.font = font(20, "bold");
        for (let i = 0; i < 3; i++) {
          const t = (f + i * 20) % 60;
          ctx.globalAlpha = 1 - t / 60;
          ctx.fillText("Z", 405 + t * 0.6 + i * 6, 315 - t);
        }
        ctx.globalAlpha = 1;
      } else {
        const jump = f < 92 ? -Math.sin((f - 80) / 12 * Math.PI) * 30 : 0;
        drawEmoji("😳", 383, 332 + jump, 52);
      }

      if (f < 55) drawCaption("早上的台南…… 還在睡覺");
      else drawCaption("⏰ 鈴鈴鈴！鬧鐘響了！", "#ffd740");
    }

    // 第 2 幕：鬧鐘特寫 → 完蛋要遲到了
    function drawClockCloseUp(f) {
      ctx.fillStyle = "#263238";
      ctx.fillRect(0, 0, 500, 600);

      // 大鬧鐘（越來越抖）
      const shake = f > 140 ? Math.sin(f * 2.1) * 6 : 0;
      ctx.save();
      ctx.translate(250 + shake, 200);
      ctx.fillStyle = "#111";
      rr(-190, -75, 380, 150, 16); ctx.fill();
      ctx.strokeStyle = "#b0bec5";
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 20;
      ctx.fillStyle = "#ff1744";
      ctx.font = "bold 66px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(introClockText(), 0, 4);
      ctx.restore();

      ctx.fillStyle = "#fff";
      ctx.font = font(24, "bold");
      ctx.textAlign = "center";
      ctx.fillText("📚 第一堂課 08:10", 250, 318);
      ctx.fillStyle = "#b0bec5";
      ctx.font = font(18);
      ctx.fillText("地點：" + dest.campus + "・" + dest.building, 250, 350);

      // 驚嚇的臉越來越大
      if (f > 140) {
        const grow = Math.min(1, (f - 140) / 20);
        drawEmoji("😱", 250, 420, 40 + grow * 50);
        drawCaption("完蛋了！要遲到了！！", "#ff5252");
      } else {
        drawCaption("等等…… 現在幾點？");
      }
    }

    // 第 3 幕：衝出家門 → 跳上腳踏車 → 出發
    function drawStreet(f) {
      const sky = ctx.createLinearGradient(0, 0, 0, 330);
      sky.addColorStop(0, "#64b5f6");
      sky.addColorStop(1, "#bbdefb");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 500, 330);

      // 台南的透天厝（一排不同顏色的房子），屋頂上有水塔
      const houses = [["#ffe0b2", 0], ["#c5e1a5", 120], ["#f8bbd0", 240], ["#b3e5fc", 360]];
      for (const [color, x] of houses) {
        ctx.fillStyle = "#cfd8dc";
        ctx.fillRect(x + 80, 84, 22, 22);
        ctx.fillStyle = "#b0bec5";
        ctx.fillRect(x + 78, 82, 26, 4);
        ctx.fillStyle = color;
        ctx.fillRect(x, 110, 120, 220);
        ctx.fillStyle = "#90a4ae";
        ctx.fillRect(x + 20, 140, 32, 36);
        ctx.fillRect(x + 68, 140, 32, 36);
        ctx.fillRect(x + 20, 200, 32, 36);
        ctx.fillRect(x + 68, 200, 32, 36);
        ctx.fillStyle = "#6d4c41";
        ctx.fillRect(x, 104, 120, 8);
      }
      // 自己家的門
      ctx.fillStyle = "#5d4037";
      ctx.fillRect(66, 262, 48, 68);
      ctx.fillStyle = "#ffd740";
      ctx.fillRect(104, 296, 5, 5);

      // 騎樓、馬路、車道線
      ctx.fillStyle = "#b0614a";
      ctx.fillRect(0, 330, 500, 50);
      ctx.fillStyle = "#555";
      ctx.fillRect(0, 380, 500, 220);
      ctx.fillStyle = "#fff";
      for (let x = -40; x < 520; x += 60) {
        const offset = f > 290 ? ((f - 290) * 6) % 60 : 0;   // 出發後車道線往後跑
        ctx.fillRect(x - offset, 488, 32, 5);
      }

      if (f < 260) {
        drawEmoji("🚲", 300, 405, 54, true);
        const t = Math.min(1, (f - 200) / 55);
        const x = 90 + t * 190;
        const bounce = Math.abs(Math.sin(f * 0.5)) * -8;
        drawEmoji("🏃", x, 360 + bounce, 50, true);
        drawEmoji("🎒", x - 18, 352 + bounce, 22);
        drawCaption("抓起書包衝出門！");
      } else if (f < 275) {
        drawEmoji("🚲", 300, 405, 54, true);
        const t = (f - 260) / 15;
        drawEmoji("🏃", 280 + t * 20, 360 - Math.sin(t * Math.PI) * 40, 50, true);
        drawCaption("跳上腳踏車！");
      } else {
        const t = f - 275;
        const x = 300 + 0.035 * t * t;
        drawEmoji("🚴", x, 400, 60, true);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        for (let i = 0; i < 4; i++) {
          const len = Math.min(120, t * 2);
          ctx.fillRect(x - 50 - len, 382 + i * 12, len, 3);
        }
        drawEmoji("💨", x - 55, 420, 28);

        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 486, 500, 84);
        ctx.fillStyle = "#ffd740";
        ctx.font = font(26, "900");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("衝啊！🚲", 250, 510);
        ctx.fillStyle = "#fff";
        ctx.font = font(16, "bold");
        ctx.fillText("目的地：" + dest.campus + "・" + dest.building + "　⏰ 剩 " + formatTime(timeLimit(dest)), 250, 546);
      }
    }

    function drawIntro() {
      const f = introFrame;
      ctx.clearRect(0, 0, W, H);
      if (f < 110) drawBedroom(f);
      else if (f < 200) drawClockCloseUp(f);
      else drawStreet(f);

      // 換場時淡入淡出
      let alpha = 0;
      for (const at of [110, 200]) {
        const d = Math.abs(f - at);
        if (d < 10) alpha = Math.max(alpha, 1 - d / 10);
      }
      if (f > INTRO_LENGTH - 25) alpha = (f - (INTRO_LENGTH - 25)) / 25;
      if (alpha > 0) {
        ctx.fillStyle = "rgba(0,0,0," + alpha + ")";
        ctx.fillRect(0, 0, W, H);
      }

      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.font = font(13);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(isTouch() ? "點一下畫面跳過 ⏭" : "空白鍵跳過 ⏭", 490, 588);

      drawHomeButton();   // 選錯目的地可以馬上回去
    }

    // ===== 暫停、回到選單 =====

    let paused = false;

    function openPause() {
      paused = true;
      for (const k in keys) keys[k] = false;   // 放開所有按住的鍵（免得回來時還在加速）
    }

    function resumeGame() {
      paused = false;
      for (const k in keys) keys[k] = false;
    }

    function drawPause() {
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.font = font(42, "900");
      ctx.fillText("⏸ 暫停", 250, 210);
      ctx.font = font(18);
      ctx.fillStyle = "#cfd8dc";
      ctx.fillText("要回到選單、重新選目的地嗎？", 250, 270);

      drawButton(PAUSE_MENU_BUTTON, "🏠 回到選單", "#c62828", 20);
      drawButton(PAUSE_RESUME_BUTTON, "▶ 繼續騎車", "#2e7d32", 20);

      if (!isTouch()) {
        ctx.fillStyle = "#b0bec5";
        ctx.font = font(15);
        ctx.fillText("空白鍵：回到選單　　Esc：繼續騎車", 250, 425);
      }
    }

    // ===== 玩家名字與排行榜 =====
    // 排行榜存在 Vercel 的伺服器（api/leaderboard.js + Upstash Redis）
    // 連不上伺服器時（例如直接打開檔案），改成只記在這台電腦，遊戲照樣能玩

    const RANKED = { 5: "lixing", 6: "guiren" };   // 只有最難的兩關（力行、歸仁）上分數榜
    const BOARD_TABS = [
      { key: "lixing", title: "力行校區 分數", unit: "score", campus: "力行校區" },
      { key: "guiren", title: "歸仁校區 分數", unit: "score", campus: "歸仁校區" },
      { key: "playtime", title: "⏱ 遊玩時間", unit: "time" }
    ];
    const API_URL = "/api/leaderboard";

    const Board = {
      online: null,      // null = 還在連線、true = 連上排行榜伺服器、false = 離線（只記在這台電腦）
      name: storeGet("tainanBikeName"),
      token: storeGet("tainanBikeToken"),
      data: null,        // 目前顯示的排行榜資料
      loading: false,
      pendingSeconds: 0, // 還沒上傳的遊玩秒數
      playFrames: 0,
      flushing: false,
      localCache: null,

      // 每台電腦一組隨機密碼：證明「這個名字是我的」，別人就不能用你的名字上傳
      ensureToken() {
        if (this.token) return;
        const bytes = new Uint8Array(24);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        this.token = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
        storeSet("tainanBikeToken", this.token);
      },

      async request(method, body) {
        if (location.protocol === "file:") throw new Error("offline");
        let url = API_URL;
        const opts = { method: method, headers: { "Content-Type": "application/json" } };
        if (method === "GET") {
          url += "?name=" + encodeURIComponent(this.name || "");
        } else {
          opts.keepalive = true;   // 關掉網頁時也能把最後的資料送出去
          opts.body = JSON.stringify(Object.assign({ name: this.name, token: this.token }, body));
        }
        const res = await fetch(url, opts);
        let data = {};
        try { data = await res.json(); } catch (e) {}
        if (res.status === 404 || res.status >= 500) throw new Error("offline");
        return { status: res.status, data: data };
      },

      // 打開網頁時：看看排行榜伺服器在不在；名字不見了（被別人註冊走）就請你換一個
      async init() {
        try {
          const r = await this.request("GET");
          this.online = r.status === 200;
          if (this.online) this.data = r.data;
        } catch (e) {
          this.online = false;
        }
        if (this.online && this.name) {
          this.ensureToken();
          try {
            const r = await this.request("POST", { action: "register" });
            if (r.status === 409) showNameDialog(false, "「" + this.name + "」已經有人用了，請換一個名字");
          } catch (e) {}
        }
      },

      // 註冊名字：成功回傳 "ok"，被別人用走了回傳 "taken"
      async register(name) {
        this.ensureToken();
        const old = this.name;
        this.name = name;
        if (this.online !== false) {
          try {
            const r = await this.request("POST", { action: "register" });
            if (r.status === 409) {
              this.name = old;
              return "taken";
            }
            if (r.status === 200) this.online = true;
          } catch (e) {
            this.online = false;
          }
        }
        storeSet("tainanBikeName", name);
        return "ok";
      },

      // ----- 這台電腦自己的紀錄（離線時用來排名）-----
      localData() {
        if (!this.localCache) {
          try {
            this.localCache = JSON.parse(storeGet("tainanBikeLocalBoard") || "{}");
          } catch (e) {
            this.localCache = {};
          }
        }
        return this.localCache;
      },
      saveLocal() {
        storeSet("tainanBikeLocalBoard", JSON.stringify(this.localData()));
      },

      // 完成力行、歸仁時上傳分數（結算畫面會顯示名次）
      async submitScore(level, score, res) {
        const b = this.localData();
        b[level] = b[level] || {};
        b[level][this.name] = Math.max(b[level][this.name] || 0, score);
        this.saveLocal();
        if (!this.online) {
          res.rankText = "📴 離線：分數記在這台電腦";
          return;
        }
        res.rankText = "📡 上傳排行榜中…";
        try {
          const r = await this.request("POST", { action: "score", level: level, score: score });
          if (r.status === 200) res.rankText = "🏆 排行榜第 " + r.data.rank + " 名（共 " + r.data.total + " 人）";
          else res.rankText = "⚠️ 排行榜上傳失敗";
        } catch (e) {
          this.online = false;
          res.rankText = "📴 離線：分數記在這台電腦";
        }
      },

      // 遊玩時間：騎車中每 60 幀（1 秒）加 1，攢到 30 秒上傳一次
      tickPlay() {
        if (!this.name) return;
        this.playFrames++;
        if (this.playFrames < 60) return;
        this.playFrames = 0;
        const b = this.localData();
        b.playtime = b.playtime || {};
        b.playtime[this.name] = (b.playtime[this.name] || 0) + 1;
        this.pendingSeconds++;
        if (this.pendingSeconds % 10 === 0) this.saveLocal();
        if (this.pendingSeconds >= 30) this.flush();
      },

      async flush() {
        this.saveLocal();
        if (!this.online) {
          this.pendingSeconds = 0;   // 離線：已經記在這台電腦了
          return;
        }
        if (!this.name || this.pendingSeconds < 1 || this.flushing) return;
        const seconds = this.pendingSeconds;
        this.pendingSeconds = 0;
        this.flushing = true;
        try {
          const r = await this.request("POST", { action: "time", seconds: seconds });
          if (r.status !== 200) this.pendingSeconds += seconds;
        } catch (e) {
          this.pendingSeconds += seconds;
        }
        this.flushing = false;
      },

      // 重新讀取排行榜
      async refresh() {
        this.loading = true;
        if (this.online) {
          try {
            const r = await this.request("GET");
            if (r.status === 200) this.data = r.data;
          } catch (e) {
            this.online = false;
          }
        }
        if (!this.online) this.data = this.localView();
        this.loading = false;
      },

      // 用這台電腦的紀錄排出名次（離線模式）
      localView() {
        const b = this.localData();
        const view = {};
        for (const t of BOARD_TABS) {
          const entries = Object.entries(b[t.key] || {})
            .map(([name, value]) => ({ name: name, value: value }))
            .sort((a, c) => c.value - a.value);
          const idx = entries.findIndex(e => e.name === this.name);
          view[t.key] = {
            top: entries.slice(0, 5),
            total: entries.length,
            me: idx >= 0 ? { rank: idx + 1, value: entries[idx].value } : null
          };
        }
        return view;
      }
    };

    // 秒數 → 「1 小時 3 分」、「5 分 20 秒」
    function formatDuration(sec) {
      sec = Math.floor(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return h + " 小時 " + m + " 分";
      if (m > 0) return m + " 分 " + s + " 秒";
      return s + " 秒";
    }

    // ----- 輸入名字的對話框 -----
    let nameDialogOpen = false;
    let nameIsRename = false;
    const nameDialog = document.getElementById("nameDialog");
    const nameInput = document.getElementById("nameInput");
    const nameError = document.getElementById("nameError");
    const nameOk = document.getElementById("nameOk");
    const nameCancel = document.getElementById("nameCancel");

    function showNameDialog(rename, errorText) {
      nameDialogOpen = true;
      nameIsRename = rename;
      for (const k in keys) keys[k] = false;
      document.getElementById("nameTitle").textContent = rename ? "✏️ 改名字" : "🚲 歡迎來到台南騎車生存記";
      nameInput.value = rename ? (Board.name || "") : "";
      nameError.textContent = errorText || "";
      nameCancel.classList.toggle("show", rename);
      nameDialog.classList.add("show");
      setTimeout(() => nameInput.focus(), 50);
    }

    function closeNameDialog() {
      nameDialogOpen = false;
      nameDialog.classList.remove("show");
      nameInput.blur();
    }

    async function submitName() {
      const name = nameInput.value.normalize("NFKC").replace(/[\u0000-\u001f\u007f]/g, "").trim();
      if (!name) {
        nameError.textContent = "請輸入名字";
        return;
      }
      if (Array.from(name).length > 12) {
        nameError.textContent = "名字最多 12 個字";
        return;
      }
      if (name === Board.name && Board.online !== null) {
        closeNameDialog();
        return;
      }
      nameOk.disabled = true;
      nameError.textContent = "確認中…";
      const r = await Board.register(name);
      nameOk.disabled = false;
      if (r === "taken") {
        nameError.textContent = "「" + name + "」已經有人用了，請換一個名字";
        return;
      }
      closeNameDialog();
      Sound.unlock();
      Sound.confirm();
      if (inBoard) Board.refresh();
    }

    nameOk.addEventListener("click", submitName);
    nameCancel.addEventListener("click", closeNameDialog);
    nameInput.addEventListener("keydown", function (event) {
      event.stopPropagation();   // 打字時不要觸發遊戲按鍵
      if (event.key === "Enter" && !event.isComposing) submitName();
      if (event.key === "Escape" && nameIsRename) closeNameDialog();
    });

    // ----- 排行榜畫面 -----
    let inBoard = false;
    let boardTab = 0;

    const BOARD_TAB_BUTTONS = [0, 1, 2].map(i => ({ x: 20 + i * 156, y: 104, w: 148, h: 36 }));
    const BOARD_BACK_BUTTON = { x: 150, y: 540, w: 200, h: 40 };
    const BOARD_RENAME_BUTTON = { x: 392, y: 60, w: 92, h: 28 };

    function openBoard() {
      inMenu = false;
      inBoard = true;
      Board.refresh();
      Sound.confirm();
    }

    function closeBoard() {
      inBoard = false;
      inMenu = true;
    }

    function drawBoard() {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#1b2a38");
      bg.addColorStop(1, "#0f1720");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "#fff";
      ctx.font = font(28, "900");
      ctx.fillText("🏆 排行榜", 250, 32);

      // 連線狀態
      ctx.font = font(12);
      if (Board.online === null) {
        ctx.fillStyle = "#b0bec5";
        ctx.fillText("連線中…", 250, 60);
      } else if (Board.online) {
        ctx.fillStyle = "#69f0ae";
        ctx.fillText("🌐 全部玩家一起比", 250, 60);
      } else {
        ctx.fillStyle = "#ffab40";
        ctx.fillText("📴 離線模式：只有這台電腦的紀錄", 250, 60);
      }

      // 我的名字、改名
      ctx.textAlign = "left";
      ctx.fillStyle = "#cfd8dc";
      ctx.font = font(13, "bold");
      ctx.fillText("👤 " + (Board.name || "—"), 22, 76);
      drawButton(BOARD_RENAME_BUTTON, "✏️ 改名", "rgba(55,71,79,0.95)", 13);

      // 分頁
      for (let i = 0; i < BOARD_TABS.length; i++) {
        const b = BOARD_TAB_BUTTONS[i];
        const active = i === boardTab;
        rr(b.x, b.y, b.w, b.h, 10);
        ctx.fillStyle = active ? "#2e7d32" : "rgba(38,56,72,0.95)";
        ctx.fill();
        ctx.strokeStyle = active ? "#69f0ae" : "rgba(255,255,255,0.12)";
        ctx.lineWidth = active ? 2 : 1;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = font(14, "bold");
        ctx.textAlign = "center";
        ctx.fillText(BOARD_TABS[i].title, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }

      const tab = BOARD_TABS[boardTab];
      const info = Board.data && Board.data[tab.key];
      const fmt = v => tab.unit === "time" ? formatDuration(v) : Math.round(v).toLocaleString() + " 分";

      // 前五名
      rr(20, 152, 460, 300, 14);
      ctx.fillStyle = "rgba(14,20,28,0.8)";
      ctx.fill();
      ctx.textAlign = "center";
      if (!info) {
        ctx.fillStyle = "#b0bec5";
        ctx.font = font(15);
        ctx.fillText(Board.loading || Board.online === null ? "讀取中…" : "讀不到排行榜", 250, 300);
      } else if (info.top.length === 0) {
        ctx.fillStyle = "#b0bec5";
        ctx.font = font(15);
        ctx.fillText("還沒有人上榜，快來搶第一！", 250, 300);
      } else {
        const medals = ["🥇", "🥈", "🥉", "4", "5"];
        for (let i = 0; i < info.top.length; i++) {
          const e = info.top[i];
          const y = 182 + i * 56;
          if (e.name === Board.name) {
            rr(30, y - 24, 440, 48, 10);
            ctx.fillStyle = "rgba(105,240,174,0.16)";
            ctx.fill();
          }
          ctx.textAlign = "center";
          ctx.fillStyle = "#ffd740";
          ctx.font = i < 3 ? font(24) : font(18, "900");
          ctx.fillText(medals[i], 62, y);
          ctx.textAlign = "left";
          ctx.fillStyle = "#fff";
          ctx.font = font(17, "bold");
          ctx.fillText(e.name + (e.name === Board.name ? "（你）" : ""), 96, y);
          ctx.textAlign = "right";
          ctx.fillStyle = "#ffd740";
          ctx.font = font(16, "bold");
          ctx.fillText(fmt(e.value), 456, y);
        }
      }

      // 我的名次
      rr(20, 464, 460, 60, 14);
      ctx.fillStyle = "rgba(14,20,28,0.8)";
      ctx.fill();
      ctx.textAlign = "center";
      const me = info && info.me;
      if (!info) {
        // 還在讀取
      } else if (!me) {
        ctx.fillStyle = "#cfd8dc";
        ctx.font = font(15, "bold");
        ctx.fillText("你還沒有紀錄", 250, 484);
        ctx.fillStyle = "#90a4ae";
        ctx.font = font(12);
        ctx.fillText(tab.unit === "time" ? "開始騎車就會累積遊玩時間" : "完成「" + tab.campus + "」就能上榜", 250, 506);
      } else if (me.rank <= 5) {
        ctx.fillStyle = "#69f0ae";
        ctx.font = font(17, "900");
        ctx.fillText("🎉 你是第 " + me.rank + " 名！（共 " + info.total + " 人）", 250, 494);
      } else {
        ctx.fillStyle = "#fff";
        ctx.font = font(15, "bold");
        ctx.fillText("你的名次：第 " + me.rank + " 名（共 " + info.total + " 人）", 250, 484);
        ctx.fillStyle = "#ffd740";
        ctx.font = font(14, "bold");
        ctx.fillText(fmt(me.value), 250, 506);
      }

      drawButton(BOARD_BACK_BUTTON, "← 回到選單", "#37474f", 16);
      if (!isTouch()) {
        ctx.fillStyle = "#90a4ae";
        ctx.font = font(12);
        ctx.textAlign = "center";
        ctx.fillText("←→ 切換排行榜　Esc 返回　N 改名", 250, 592);
      }
    }

    // ===== 開始一局、重新開始、回到選單 =====

    function startGame(index) {
      dest = DESTINATIONS[index];
      resetGame();
      inMenu = false;
      inBoard = false;
      message = "🎯 目的地：" + dest.campus + "・" + dest.building;
      messageTimer = 120;
      Music.start();
    }

    // 重新開始：把所有會變的資料都設回一開始的樣子
    function resetGame() {
      // 腳踏車
      player.lane = 1;
      player.x = 250;
      player.y = 520;
      player.vx = 0;
      player.tilt = 0;
      speed = 3;

      // 道路、障礙物、特效
      roadOffset = 0;
      groundScroll = 0;
      obstacles = [];
      obstacleTimer = 0;
      nextObstacleTime = 160;
      particles = [];
      popups = [];
      skids = [];
      confetti = [];
      tagQueue = [];
      hitFlash = 0;
      bellCooldown = 0;
      wasBraking = false;

      // 路線和目的地
      segIndex = 0;
      segDistance = 0;
      gate = null;
      elapsedFrames = 0;
      won = false;

      // 路口和轉彎
      currentStreet = dest.route[0].street;
      intersection = null;
      intersectionTimer = 0;
      nextIntersectionDist = 900;
      crossTrafficTimer = 0;
      turnQueued = 0;
      turning = null;

      // 街景
      scenery = [];
      fillScenery(-160, false);

      // 命、分數、各種效果
      lives = 3;
      invincibleTimer = 0;
      shakeTimer = 0;
      message = "";
      messageTimer = 0;
      lastHitMsg = "";
      gameOver = false;
      gameOverReason = "";
      result = null;
      resultFrame = 0;
      paused = false;
      stats.distance = 0;
      stats.nearMiss = 0;
      stats.perfectStop = 0;
      stats.bell = 0;
    }

    function enterMenu() {
      Board.flush();   // 回選單時把遊玩時間上傳
      inMenu = true;
      inBoard = false;
      inIntro = false;
      inHelp = false;
      paused = false;
      gameOver = false;
      intersection = null;
      obstacles = [];
      gate = null;
      turning = null;
      particles = [];
      popups = [];
      skids = [];
      confetti = [];
      scenery = [];
      fillScenery(-160, false);
      for (const k in keys) keys[k] = false;
      Music.start();
    }

    // 正在騎車（不是選單、說明、動畫、結束畫面）
    function isPlaying() {
      return !inMenu && !inHelp && !inIntro && !inBoard && !gameOver;
    }

    function toggleMute() {
      Sound.muted = !Sound.muted;
      Sound.applyMute();
      storeSet("tainanBikeMuted", Sound.muted ? "1" : "0");
      if (isPlaying()) {
        message = Sound.muted ? "🔇 已靜音（M 鍵開關）" : "🔊 音效開啟";
        messageTimer = 60;
      }
    }

    // ===== 第 4 步：遊戲迴圈 =====

    let wasBraking = false;   // 上一幀有沒有在煞車（用來判斷「剛開始煞車」）

    // 更新遊戲資料（只算數字，不畫圖）
    function update() {
      if (turning) {
        updateTurn();         // 轉彎中：沿著圓弧走，地面不捲動
      } else {
        updatePlayer();
        scrollGround(speed);
        updateScenery(speed);
        segDistance = segDistance + speed;   // 這一段路騎了多遠
        updateGate();

        // 用力煞車：留下煞車痕、發出煞車聲
        const braking = !!keys["ArrowDown"];
        if (braking && speed > 2.2) {
          skids.push({ x: player.x, y: player.y + 26, len: speed + 1, life: 220 });
          if (skids.length > 260) skids.shift();
        }
        if (braking && !wasBraking && speed > 4.5) Sound.screech();
        wasBraking = braking;
      }
      stats.distance = stats.distance + speed;
      elapsedFrames = elapsedFrames + 1;
      updateIntersection();
      updateObstacles();
      updateFx(turning ? 0 : speed);
      checkCollisions();
      updateEffects();
    }

    // 每一個「固定的 1/60 秒」做一次
    function tick() {
      frameCount++;
      if (inHelp) return;
      if (inIntro) {
        introFrame++;
        introSounds(introFrame);
        if (introFrame >= INTRO_LENGTH) endIntro();
        return;
      }
      if (inBoard) return;
      if (inMenu) {
        // 選單背景的街道慢慢往前捲
        scrollGround(1.6);
        updateScenery(1.6);
        return;
      }
      if (paused) return;
      if (gameOver) {
        resultFrame++;
        updateFx(0);
        updateConfetti();
        return;
      }
      Board.tickPlay();   // 只有真的在騎車才算遊玩時間
      update();
    }

    // 依照目前的狀態畫出畫面
    function render() {
      ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);   // 之後都用 500 × 600 的座標畫
      if (inHelp) drawHelp();
      else if (inIntro) drawIntro();
      else if (inBoard) drawBoard();
      else if (inMenu) drawMenu();
      else {
        draw();
        if (paused) drawPause();
      }
    }

    // 主迴圈：不管螢幕是 60Hz 還是 144Hz，遊戲都固定每秒更新 60 次
    const STEP = 1000 / 60;
    let lastTime = 0;
    let accumulator = 0;

    function frame(now) {
      if (!lastTime) lastTime = now;
      let dt = now - lastTime;
      lastTime = now;
      if (dt > 250) dt = 250;   // 切到別的分頁再回來，不要一口氣快轉
      accumulator += dt;
      let steps = 0;
      while (accumulator >= STEP - 0.5 && steps < 8) {
        tick();
        accumulator -= STEP;
        steps++;
      }
      if (accumulator < 0) accumulator = 0;
      render();
      requestAnimationFrame(frame);
    }

    // ===== 第 3 步：鍵盤控制 =====

    // 記錄哪些按鍵「正被按住」（加速、煞車要按住才有效）
    const keys = {};

    document.addEventListener("keydown", function (event) {
      // 正在輸入名字：鍵盤留給輸入框，遊戲先不理
      if (nameDialogOpen) return;

      // 方向鍵和空白鍵不要讓網頁捲動
      if (event.key.startsWith("Arrow") || event.key === " ") {
        event.preventDefault();
      }
      keys[event.key] = true;

      // 第一次按鍵時打開聲音（瀏覽器規定）
      Sound.unlock();
      if (!Music.playing && (inMenu || isPlaying())) Music.start();

      // 換車道只在「剛按下」時算一次，按住不放不會連續換
      if (event.repeat) return;

      if (event.key === "m" || event.key === "M") {
        toggleMute();
        return;
      }

      // 玩法說明：空白鍵、Enter、Esc 繼續
      if (inHelp) {
        if (event.key === " " || event.key === "Enter" || event.key === "Escape") closeHelp();
        return;
      }

      // 開場動畫：空白鍵、Enter 跳過；Esc 回選單
      if (inIntro) {
        if (event.key === " " || event.key === "Enter") endIntro();
        if (event.key === "Escape") enterMenu();
        return;
      }

      // 排行榜：←→ 切換、Esc / 空白鍵返回、N 改名
      if (inBoard) {
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          boardTab = (boardTab + (event.key === "ArrowLeft" ? 2 : 1)) % BOARD_TABS.length;
          Sound.click();
        }
        if (event.key === "Escape" || event.key === " " || event.key === "Enter" || event.key === "l" || event.key === "L") closeBoard();
        if (event.key === "n" || event.key === "N") showNameDialog(true);
        return;
      }

      // 選單：↑↓ 選目的地，空白鍵出發，H 看玩法說明，L 看排行榜
      if (inMenu) {
        if (event.key === "l" || event.key === "L") {
          openBoard();
          return;
        }
        if (event.key === "ArrowUp") {
          menuIndex = (menuIndex - 1 + DESTINATIONS.length) % DESTINATIONS.length;
          Sound.click();
        }
        if (event.key === "ArrowDown") {
          menuIndex = (menuIndex + 1) % DESTINATIONS.length;
          Sound.click();
        }
        if (event.key === " " || event.key === "Enter") requestStart(menuIndex);
        if (event.key === "h" || event.key === "H") showHelp("menu");
        return;
      }

      // 結束畫面：空白鍵回選單（播一下才能跳過，免得不小心按掉）
      if (gameOver) {
        if ((event.key === " " || event.key === "Enter") && resultFrame > 30) enterMenu();
        return;
      }

      // 暫停中：空白鍵回選單、Esc 繼續騎
      if (paused) {
        if (event.key === " " || event.key === "Enter") enterMenu();
        if (event.key === "Escape") resumeGame();
        return;
      }

      // 騎車中按 Esc → 暫停
      if (event.key === "Escape") {
        openPause();
        return;
      }

      // 按鈴（B 鍵或空白鍵）
      if (event.key === "b" || event.key === "B" || event.key === " ") {
        ringBell();
        return;
      }

      // 轉彎中不能換車道
      if (turning) return;

      // 前方路口是否在「可以準備轉彎」的距離內
      const I = intersection;
      const canQueue = I && !I.passed && I.isRoute && inTurnRange(I);   // 只有導航路口能轉彎

      // 車道編號：-1 = 左邊人行道、0 ~ 2 = 馬路、3 = 右邊人行道
      if (event.key === "ArrowLeft") {
        if (player.lane === 0 && canQueue && I.crossDir === -1) {
          turnQueued = -1;                 // 在最左車道、導航要左轉 → 準備左轉
          message = "↰ 準備左轉" + I.name;
          messageTimer = 45;
          Sound.confirm();
        } else if (player.lane > -1) {
          player.lane = player.lane - 1;   // 往左換車道（最左可以騎上人行道）
          turnQueued = 0;                  // 換車道就取消轉彎
        }
      }
      if (event.key === "ArrowRight") {
        if (player.lane === 2 && canQueue && I.crossDir === 1) {
          turnQueued = 1;                  // 在最右車道、導航要右轉 → 準備右轉
          message = "↱ 準備右轉" + I.name;
          messageTimer = 45;
          Sound.confirm();
        } else if (player.lane < 3) {
          player.lane = player.lane + 1;   // 往右換車道（最右可以騎上人行道）
          turnQueued = 0;
        }
      }
    });

    // 放開按鍵
    document.addEventListener("keyup", function (event) {
      keys[event.key] = false;
    });

    // ===== 手機觸控 =====

    // 送出一個「假的」鍵盤事件 → 直接沿用上面寫好的鍵盤控制
    function sendKey(type, key) {
      document.dispatchEvent(new KeyboardEvent(type, { key: key }));
    }

    // 觸控按鈕：手指按下 = 按下鍵盤，手指放開 = 放開鍵盤（所以加速、煞車可以按住）
    for (const btn of document.querySelectorAll("#touch button")) {
      const key = btn.dataset.key;
      btn.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        btn.classList.add("down");
        sendKey("keydown", key);
      });
      function release() {
        if (!btn.classList.contains("down")) return;
        btn.classList.remove("down");
        sendKey("keyup", key);
      }
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("pointerleave", release);   // 手指滑出按鈕也算放開
    }

    // 點畫面
    canvas.addEventListener("pointerdown", function (event) {
      Sound.unlock();
      if (!Music.playing && (inMenu || isPlaying())) Music.start();

      // 畫面可能被縮放過，要把點擊位置換算回遊戲裡的座標
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left - canvas.clientLeft) * W / canvas.clientWidth;
      const y = (event.clientY - rect.top - canvas.clientTop) * H / canvas.clientHeight;

      if (nameDialogOpen) return;

      if (inHelp) {
        closeHelp();                         // 說明畫面：點一下繼續
      } else if (inIntro) {
        if (inButton(HOME_BUTTON, x, y)) enterMenu();   // 點 🏠 回選單
        else endIntro();                                  // 點其他地方跳過動畫
      } else if (inBoard) {
        if (inButton(BOARD_BACK_BUTTON, x, y)) closeBoard();
        else if (inButton(BOARD_RENAME_BUTTON, x, y)) showNameDialog(true);
        for (let i = 0; i < BOARD_TAB_BUTTONS.length; i++) {
          if (inButton(BOARD_TAB_BUTTONS[i], x, y)) {
            boardTab = i;
            Sound.click();
          }
        }
      } else if (inMenu) {
        if (inButton(MENU_SOUND_BUTTON, x, y)) {
          toggleMute();
          return;
        }
        if (inButton(MENU_BOARD_BUTTON, x, y)) {
          openBoard();
          return;
        }
        if (inButton(MENU_HELP_BUTTON, x, y) || y < 85) {
          showHelp("menu");                  // 點標題區：看玩法說明
          return;
        }
        for (let i = 0; i < DESTINATIONS.length; i++) {
          const top = 92 + i * 66;           // 跟 drawMenu 裡卡片的位置一樣
          if (y >= top && y <= top + 60) {
            menuIndex = i;
            requestStart(i);
            break;
          }
        }
      } else if (gameOver) {
        if (resultFrame > 30) enterMenu();
      } else if (paused) {
        if (inButton(PAUSE_MENU_BUTTON, x, y)) enterMenu();
        else if (inButton(PAUSE_RESUME_BUTTON, x, y)) resumeGame();
      } else if (inButton(HOME_BUTTON, x, y)) {
        openPause();                         // 騎車中點 🏠 → 暫停
      } else if (inButton(SOUND_BUTTON, x, y)) {
        toggleMute();
      }
    });

    // 切到別的分頁：自動暫停、聲音也停
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        if (isPlaying() && !paused) openPause();
        Board.flush();   // 離開網頁前把遊玩時間送出去
        if (Sound.ctx) Sound.ctx.suspend();
      } else if (Sound.ctx) {
        Sound.ctx.resume();
      }
    });

    // ===== 啟動遊戲！=====
    initPatterns();
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    Sound.muted = storeGet("tainanBikeMuted") === "1";
    enterMenu();
    requestAnimationFrame(frame);

    // 第一次來先問名字；然後連線排行榜伺服器
    if (!Board.name) showNameDialog(false);
    Board.init();
  </script>
</body>
</html>
